<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<script type="text/javascript" src="parts.js"></script>
<script type="text/javascript">

function start() {
    timerno = setInterval(mainloop, timer) 
}

function onclick_canvas(evt) {
    mouse = mousezahyo(canvas, evt) 
    if (mode === 0) { 
        if (onstart(mouse.x, mouse.y)) { 
            mode = 5 
        }
    }
}

function onmove_canvas(evt) {
    if (mode === 5) { //
        mouse = mousezahyo(canvas, evt) 
        hamsize = hammersize(mouse.y) 
        hammerx = mouse.x - hamsize / 2 
        hammery = mouse.y - hamsize / 2 
    }
}

function ondown_canvas(evt) {
    if (mode === 5) { 
        hammers = 1 
    }
}

function onup_canvas(evt) {
    if (mode === 5) { 
        hammers = 0 
    }
}

function mainloop() {

    draw() 
}

function drawitem() {
    ctx.drawImage(play, 0, 0) 
}

function draw() {
    if (mode === 0) { 
        ctx.drawImage(title, 0, 0) 
        for (let i = 3; i <= 8; i++) { 
            if (i !== 7) { 
                drawitachi(i) 
            } else { 
                drawitachig(i) 
            }
        }
    } else if (mode === 5) { //
        drawitem() 
        ctx.drawImage(hammer[hammers], hammerx, hammery, hamsize, hamsize) 
    }
}
</script>

</head>
<body onload="init();"> 
<canvas id="canvas" width="640" height="480" /></canvas> 
<img id="title" src="title.png" style="display:none" /> 
<img id="play" src="play.png" style="display:none" /> 
<img class="hammer" src="hammer0.gif" style="display:none" /> 
<img class="hammer" src="hammer1.gif" style="display:none" /> 
<img id="itachi" src="itachi.gif" style="display:none" /> 
<img id="itachig" src="itachig.gif" style="display:none" /> 
<img id="atari" src="atari.gif" style="display:none" /> 
<img id="timeup" src="timeup.gif" style="display:none" /> 
</body>
</html>
