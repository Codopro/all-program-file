<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<script type="text/javascript" src="parts.js"></script>
<script type="text/javascript">


function start() {
    for (let i = 0; i < 5; i++) { 
        oto[i] = new Audio("oto" + i + ".mp3") 
        oto[i].preload = "auto" 
        oto[i].load() 
    }
    timerno = setInterval(mainloop, timer) 
}

function onclick_canvas(evt) {
    mouse = mousezahyo(canvas, evt) 
    if (mode === 0) { 
        if (onstart(mouse.x, mouse.y)) { 
            oto[0].currentTime = 0 
            oto[0].play() 
            mode = 5 
        }
    } else if (mode === 9) { 
        if (onrestart(mouse.x, mouse.y)) { 
            sounditachi(0) 
            score = 0 
            hammers = 0 
            itachis = [0, 0, 0, 0, 0, 0, 0, 0, 0] 
            itachiwait = 20 
            itachino = -1 
            gametimer = gametimeri 
            bonustime = gametimeri / 2 
            mode = 5 
        }
    }
}

function onmove_canvas(evt) {
    if (mode >= 5 && mode < 9) { 
        mouse = mousezahyo(canvas, evt) 
        hamsize = hammersize(mouse.y) 
        hammerx = mouse.x - hamsize / 2 
        hammery = mouse.y - hamsize / 2 
    }
}

function ondown_canvas(evt) {
    if (mode >= 5 && mode < 9) { 
        hammers = 1 
        if (mode === 5 || mode === 6) { 
            if (itachis[itachino] === 1 && hammeritachi(itachino)) { 
                itachis[itachino] = 4 
                score = score + getpoint(itachino, mode) 
                itachicount = itachicounti / 2 
            }
        } else { 
            for (let i = sanren; i < 9; i = i + 3) { 
                if (itachis[i] === 1 && hammeritachi(i)) { 
                    itachis[i] = 4 
                    score = score + getpoint(i, mode) 
                    itachicount = itachicounti / 2 
                }
            }
        }
        if (score >= 20 && bonustime > 0) { 
            oto[1].currentTime = 0 
            oto[1].play() 
            gametimer = gametimer + bonustime 
            bonustime = 0 
        }
    }
}

function onup_canvas(evt) {
    if (mode >= 5 && mode < 9) { 
        hammers = 0 
    }
}

function mainloop() {
    if (mode >= 5 && mode < 9) { 
        gametimer = gametimer - 0.05 
        if (gametimer <= 0.0) { 
            oto[2].currentTime = 0 
            oto[2].play() 
            mode = 9 
            hiscoreupdate(score) 
            return 
        }
        if (itachiwait > 0) { 
            itachiwait-- 
        } else { 
            if (itachicount <= 0) { 
                if (score > 10 && Math.random() > 0.75) { 
                    sounditachi(3) 
                    mode = 6 
                    itachicount = itachicounti / 2 
                    itachino = getitachino() 
                    itachis[itachino] = 1 
                } else if (score > 10 && Math.random() > 0.8) { 
                    sounditachi(4) 
                    mode = 7 
                    itachicount = itachicounti * 2 
                    sanren = Math.floor(Math.random() * 3) 
                    for (let i = sanren; i < 9; i = i + 3) { 
                        itachis[i] = 1 
                    }
                } else { 
                    mode = 5 
                    itachicount = itachicounti 
                    itachino = getitachino() 
                    itachis[itachino] = 1 
                } 
            } else { 
                itachicount-- 
                if (itachicount <= 0) { 
                    if (mode === 5 || mode === 6) {  
                        itachis[itachino] = 0 
                    } else { 
                        for (let i = sanren; i < 9; i = i + 3) { 
                            itachis[i] = 0 
                        }
                    }
                    itachiwait = getitachiwait() 
                }
            }
        }
    }
    draw() 
}

function drawitem() {
    ctx.drawImage(play, 0, 0) 
    drawtimer(gametimer) 
    ctx.font = '36pt Arial' 
    ctx.fillStyle = 'white' 
    ctx.fillText("SCORE:" + ("0000" + score).slice(-4), 168, 120) 
    if (hiscore[0] > 0) { 
        ctx.font = '24pt Arial' 
        ctx.fillStyle = 'white' 
        ctx.fillText("HI-SCORE", 30, 392) 
        drawhiscore(1) 
        if (hiscore[1] > 0) { 
            drawhiscore(2) 
            if (hiscore[2] > 0) { 
                drawhiscore(3) 
            }
        }
    }
}

function draw() {
    if (mode === 0) { 
        ctx.drawImage(title, 0, 0) 
        for (let i = 3; i <= 8; i++) { 
            if (i !== 7) { 
                drawitachi(i) 
            } else { 
                drawitachig(i) 
            }
        }
    } else if (mode >= 5 && mode < 9) { 
        drawitem() 
        if (mode === 5 || mode === 6) { 
            if (itachis[itachino] > 0) { 
                if (mode === 5) { 
                    drawitachi(itachino) 
                } else { 
                    drawitachig(itachino)  
                } 
                if (itachis[itachino] === 4) { 
                    drawatari(itachino) 
                }
            }
        } else { 
            for (let i = sanren; i < 9; i = i + 3) { 
                if (itachis[i] > 0) { 
                    drawitachi(i) 
                }
                if (itachis[i] === 4) { 
                    drawatari(i) 
                }
            }
        }
        ctx.drawImage(hammer[hammers], hammerx, hammery, hamsize, hamsize) 
    } else if (mode === 9) { 
        drawitem() 
        ctx.drawImage(timeup, 60, 180) 
        ctx.drawImage(restart, 450, 385)
    }
}
</script>

</head>
<body onload="init();"> 
<canvas id="canvas" width="640" height="480" /></canvas> 
<img id="title" src="title.png" style="display:none" /> 
<img id="play" src="play.png" style="display:none" /> 
<img class="hammer" src="hammer0.gif" style="display:none" /> 
<img class="hammer" src="hammer1.gif" style="display:none" /> 
<img id="itachi" src="itachi.gif" style="display:none" /> 
<img id="itachig" src="itachig.gif" style="display:none" /> 
<img id="atari" src="atari.gif" style="display:none" /> 
<img id="timeup" src="timeup.gif" style="display:none" /> 
<img id="restart" src="restart.gif" style="display:none" /> </body>
</html>
