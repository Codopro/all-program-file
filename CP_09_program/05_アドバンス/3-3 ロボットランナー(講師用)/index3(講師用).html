<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<script type="text/javascript" src="parts.js"></script>
<script type="text/javascript" src="map.js"></script>
<script type="text/javascript">

//ゲームの開始の時にやること
function start() {
    timerno = setInterval(mainloop, timer) //タイマーを起動する
}

//キーをおし終えた時にやること
function keyUp(evt) {
}

//キーがおされた時にやること
function keyDown(evt) {
}

//一定時間おきにやること
function mainloop() {
    draw() //画面をえがく
}

//画面をえがく
function draw() {
    if (mode === 0) { //タイトル画面？
        for (let i = 0; i < 5; i++) { //i=0,1,2,3,4についてくり返す
            ctx.drawImage(hazard, i * 40 + 220, 220) //障害物画像でロゴマークを表示
        }
    }
}
</script>

</head>
<body onload="init();"> <!-- 最初に１回だけやること（起動処理）を示す -->
<canvas id="canvas" width="640" height="480" /></canvas> <!-- キャンバスの設置 -->
<img id="base" src="base.png" style="display:none" /> <!-- 背景の画像おき場 -->
<img class="robot" src="robot0.gif" style="display:none" /> <!-- ロボット[0]の画像おき場 -->
<img class="robot" src="robot1.gif" style="display:none" /> <!-- ロボット[1]の画像おき場 -->
<img class="robot" src="robot2.gif" style="display:none" /> <!-- ロボット[2]の画像おき場 -->
<img id="hazard" src="hazard.png" style="display:none" /> <!-- 障害物の画像おき場 -->
<img id="bonusitem" src="bonusitem.gif" style="display:none" /> <!-- ボーナスアイテムの画像おき場 -->
<img id="bonusget" src="bonusget.gif" style="display:none" /> <!-- ボーナスゲットの画像おき場 -->
<img id="speedup" src="speedup.gif" style="display:none" /> <!-- スピードアップの画像おき場 -->
<img id="itemget" src="itemget.gif" style="display:none" /> <!-- アイテムゲットの画像おき場 -->
</body>
</html>
