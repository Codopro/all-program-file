<script type="text/javascript">

function start() {
    timerno = setInterval(mainloop, timer)
}

function keyUp(evt) {
}

function keyDown(evt) {
}

function mainloop() {
    draw()
}

function draw() {
    if (mode === 0) {
        for (let j = 0; j < 5; j++) {
            for (let i = 0; i < 5; i++) {
                if (i !== j) {
                    ctx.drawImage(hazard, i * 40 + 220, j * 40 + 220)
                }
            }
        }
    }
}
</script>
