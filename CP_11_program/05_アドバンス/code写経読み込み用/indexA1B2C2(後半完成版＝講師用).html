<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<script type="text/javascript" src="parts.js"></script>
<script type="text/javascript" src="mapc.js"></script>
<script type="text/javascript">

function start() {
    let n = 4
    for (let j = 2; j < 9; j = j + 2) {
        for (let i = 2; i < 9; i = i + 2) {
            while (true) {
              let d = Math.floor(Math.random() * n)
              let x = i;
              let y = j;
              if (d === 0) {
                  x = x + 1
              } else if (d === 1) {
                  x = x - 1
              } else if (d === 2) {
                  y = y + 1
              } else if (d === 3) {
                  y = y - 1
              }
              if (map1[y][x] === 0) {
                  map1[y][x] = 8
                  map0[y][x] = 8
                  break
              }
          }
      }
      n = 3
    }
    hidariwarp.x = hidariwarp.x + 2 * Math.floor(Math.random() * 2)
    migiwarp.x = migiwarp.x - 2 * Math.floor(Math.random() * 2)
    for (let i = 0; i < 6; i++) {
        oto[i] = new Audio("oto" + i + ".mp3")
        oto[i].preload = "auto"
        oto[i].load()
    }
    timerno = setInterval(mainloop, timer)
}

function onclick_canvas(evt) {
    mouse = mousezahyo(canvas, evt)
    if (mode >= 5 && !onhidariwarp() && !onmigiwarp() && onplayer()) {
        retry()
        return
    }
    if (mode === 0) {
        mode = 4
    } else if (mode === 4 && onplayer()) {
        oto[0].currentTime = 0
        oto[0].play()
        mode = 5
    } else if (mode === 5) {
        if (onhidariwarp()) {
            // player.x = migiwarp.x
            // player.y = migiwarp.y
            oto[2].currentTime = 0
            oto[2].play()
            mode = 6
            warpcount = warpstart
            warpmode = 1
        } else if (onmigiwarp()) {
            oto[2].currentTime = 0
            oto[2].play()
            mode = 6
            warpcount = warpstart
            warpmode = 2
        }
    } else if (mode === 6 && onplayer()) {
        mode = 5
        warpmode = 0
    }
}

function onmove_canvas(evt) {
    if (mode === 5) {
        mouse = mousezahyo(canvas, evt)
        playerp.x = player.x
        playerp.y = player.y
        playerdousa()
        if (hcenter() && vcenter()) {
            tuukashori(200, 10)
            if (fruitari === 1 && player.x === fruit.x && player.y === fruit.y) {
                oto[1].currentTime = 0
                oto[1].play()
                fruitari = 0
                goalmode = 1
            }
            if (goalmode === 1 && map1[player.y][player.x] === 3) {
                hiscoreupdate()
                mode = 9
                if (allclear() === 1) {
                    oto[5].currentTime = 0
                    oto[5].play()
                } else {
                    oto[4].currentTime = 0
                    oto[4].play()
                }
            }
        }
        if (playerp.x !== player.x || playerp.y !== player.y) {
            tekidousa(25)
        }
        if (hantei()) {
            oto[3].currentTime = 0
            oto[3].play()
            hiscoreupdate()
            mode = 8
        }
    }
}

function mainloop() {
    if (mode === 6 && warpcount > -warpstart) {
        warpcount--
        if (warpcount < 0) {
            if (warpmode === 1) {
                player.x = migiwarp.x
                player.y = migiwarp.y
            } else {
                player.x = hidariwarp.x
                player.y = hidariwarp.y
            }
        }
    }
    draw()
}

function drawmap() {
    fillblack(24, 24, 432, 432)
    for (let j = 0; j < 11; j++) {
         for (let i = 0; i < 11; i++) {
            if (map1[j][i] === 8) {
                ctx.drawImage(wall, i * 48 - 24, j * 48 - 24)
            } else if (map1[j][i] === 3) {
                ctx.drawImage(goal[goalmode], i * 48 - 24, j * 48 - 24)
            } else if (map1[j][i] === 1) {
                fillblue48(i, j)
            }
        }
    }
    ctx.drawImage(warp, hidariwarp.x * 48 - 24, hidariwarp.y * 48 - 24)
    ctx.drawImage(warp, migiwarp.x * 48 - 24, migiwarp.y * 48 - 24)
    if (fruitari === 1) {
        ctx.drawImage(fruitimg, 216, 24)
    }
    if (mode === 6 && warpcount > -warpstart) {
        ctx.drawImage(playerimg, player.x * 48 - 24, player.y * 48 - 24, 48, Math.abs(warpcount))
    } else {
        ctx.drawImage(playerimg, player.x * 48 - 24, player.y * 48 - 24)
    }
    ctx.drawImage(enemy[tekimuki], teki.x * 48 - 24, teki.y * 48 - 24)
    drawscore(score)
    ctx.drawImage(hiscoreboard, 478, 322)
    ctx.font = '20pt Arial'
    for(let i = 0; i < 3; i++) {
        ctx.fillText((i + 1) + ":" + ("000000" + hiscore[i]).slice(-6), 490, 380 + 30 * i)
    }
}

function draw() {
    if(mode === 0) {
        fillblack(0, 0, 640, 480)
        let xs = (window1.sx - window1.sy) / 2
        for(let j = 0; j < 5; j++) {
            for(let i = 0; i < 5; i++) {
                if(i !== 2) {
                    ctx.drawImage(wall, xs + 96 * i, 96 * j, 96, 96)
                }
            }
        }
        ctx.drawImage(title, xs + 96, 96)
    } else if(mode === 4) {
        haikeiwall()
        drawmap()
        drawmessage(0)
    } else if(mode === 5) {
        drawmap()
        if ((onhidariwarp() || onmigiwarp()) && onplayer()) {
            drawmessage(5)
        } else if (fruitari === 1) {
            drawmessage(7)
        } else {
            drawmessage(1)
        }
    } else if(mode === 6) {
        drawmap()
        drawmessage(6)
    } else if (mode === 8) {
        drawmap()
        drawmessage(4)
        drawcenter("Game Over", 18, 64)
    } else if (mode === 9) {
        drawmap()
        if (allclear() === 1) {
            drawmessage(2)
            drawcenter("CLEAR!", 18, 96)
        } else {
            drawmessage(3)
            drawcenter("GOAL!", 48, 96)
        }
    }
}
</script>

</head>

<img class="goal" src="goal1.png" style="display:none" />

<img class="message" src="message0.png" style="display:none" />
<img class="message" src="message1.png" style="display:none" />
<img class="message" src="message2.png" style="display:none" />
<img class="message" src="message3.png" style="display:none" />
<img class="message" src="message4.png" style="display:none" />
<img class="message" src="message5.png" style="display:none" />
<img class="message" src="message6.png" style="display:none" />
<img id="scoreboard" src="score.png" style="display:none" />
<img class="enemy" src="enemy0.gif" style="display:none" />
<img class="enemy" src="enemy1.gif" style="display:none" />
<img class="message" src="message7.png" style="display:none" />
<img id="fruitimg" src="fruit.png" style="display:none" />
<img id="hiscoreboard" src="hiscore.png" style="display:none" />
</body>
</html>
