<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <script type="text/javascript" src="janken_parts.js"></script>
    <script type="text/javascript">
      
      //ゲームの開始の時にやること
      function start() {
          
          timerno = setInterval(mainloop, timer)
      }
      
      //キーをおし終えた時にやること
      function keyUp(evt) {
          if ((mode === 0 || mode === 6) && evt.keyCode === 13) { //タイトルモードでエンターキーがおされたら//
              if (shohai.length >= 5) {
                  mode = 9
              } else {
                  mode = 5 //プレイモードにする
              }
          }
      }

      //キーがおされた時にやること
      function keyDown(evt) {
          if (mode === 5) {
              if (evt.keyCode === 37 || evt.keyCode === 38 || evt.keyCode === 39) { //タイトルモードでスペースキーがおされたら//
                  player_hand = evt.keyCode - 37
                  janken_hantei()
                  mode = 6 // 判定モードにする
              }
          }
      }
      
      //一定時間おきにやること
      function mainloop() {
          
          draw()
      }

      //プレイ画面でモードに共通するものをえがく
      function drawfield() {
      }

      function janken_hantei() {
          player_win = 0
          if (player_hand === 0) {
              if (computer_hand === 1) {
                  player_win = 1
              }
          } else if (player_hand === 1) {
              if (computer_hand === 2) {
                  player_win = 1
              }
          } else {
              if (computer_hand === 0) {
                  player_win = 1
              }
          }
          if (computer_hand === player_hand) {
              player_win = 2
          }
          
          if (player_win === 0) {
              computer_point++
              shohai.push(player_win)
          } else if (player_win === 1) {
              player_point++
              shohai.push(player_win)
          }
      }
      
      //画面をえがく
      function draw() {
          if(mode === 0) { //タイトルモードなら
              // タイトルを表示
              ctx.drawImage(haikei, 0, 0, 640, 480) //タイトル画像を表示
              ctx.drawImage(title, 150, 50, 320, 100) //タイトル画像を表示
              ctx.drawImage(gu,    150, 200, 100, 100)      //ぐー画像を表示
              ctx.drawImage(choki, 250, 200, 100, 100) //ちょき画像を表示
              ctx.drawImage(pa,    350, 200, 100, 100)    //ぱー画像を表示
              
              ctx.fillStyle = "blue";
              ctx.font = "25pt 'ＭＳ ゴシック'";
//              ctx.font = '24pt Arial' //文字サイズを指定
              ctx.textAlign = "left";
              ctx.textBaseline = "top";
              ctx.fillText("エンターキーを押してね！", 100, 400);
        
          } else if (mode === 5) { // じゃんけん待ちモード
//              ctx.clearRect(0, 0, 640, 480)
              ctx.drawImage(haikei, 0, 0, 640, 480) //タイトル画像を表示
//              ctx.clearRect(350, 250, 200, 200)
              ctx.drawImage(janken[computer_hand], 350, 250, 200, 200) //じゃんけん画像を表示
              ctx.drawImage(janken_key, 50, 275, 250, 150)
              if (computer_hand++ >= 2) {
                  computer_hand = 0
              }
          } else if (mode === 6) { // じゃんけん決定モード
//              ctx.fillStyle = 'pink';
//              ctx.fillRect(0, 0, 640, 480);
//              ctx.clearRect(350, 250, 200, 200) //じゃんけん画像を表示

              ctx.drawImage(haikei, 0, 0, 640, 480) //タイトル画像を表示
              ctx.drawImage(janken_key, 50, 275, 250, 150)

              ctx.drawImage(janken[computer_hand], 350, 50, 200, 200) //じゃんけん画像を表示

              if (player_hand === 0) {
                  ctx.drawImage(gu, 100, 50, 200, 200) //じゃんけん画像を表示
              } else if (player_hand === 1) {
                  ctx.drawImage(choki, 100, 50, 200, 200) //じゃんけん画像を表示
              } else {
                  ctx.drawImage(pa, 100, 50, 200, 200) //じゃんけん画像を表示
              }

              if (player_win === 0) {
                  ctx.fillText("あなたの負け...", 10, 40)
              } else if (player_win === 1) {
                  ctx.fillText("あなたの勝ち！", 10, 40)
//                  ctx.fillText("〇 ×", 550, 40 * (player_point + computer_point))
              } else {
                  ctx.fillText("あいこ", 10, 40);
              }
              
              //              ctx.fillText(, 600, 40)

//              ctx.fillText(shohai.length, 400, 200)
              for (let i = 0; i < shohai.length; i++) {
//                  ctx.fillText(shohai[i] + ' |akakaka ', 400, 350)
                  //                  ctx.fillText('aaaaaaaa', 400, 250 + i * 30)
                  if (shohai[i] === 0) {
                      ctx.fillText("× | 〇", 400, 250 + i * 30)
                  } else {
                      ctx.fillText("〇 | ×", 400, 250 + i * 30)
                  }
              }
              ctx.fillText("-------", 400, 400)
              ctx.fillText(player_point + ' vs ' + computer_point, 420, 420)
              
              
              ctx.fillText("エンターキーを押してね", 100, 450);
                 
              
          } else if (mode === 9) { // ゲーム終わり
              if (player_point > computer_point) {
                  ctx.drawImage(you_win, 0, 0, 640, 480) //タイトル画像を表示
              } else {
                  ctx.drawImage(you_lose, 0, 0, 640, 480) //タイトル画像を表示
                  
              }
          }
    
      }
    </script>

  </head>
  <body onload="init();"> <!-- 最初に１回だけやること（起動処理）を示す -->
    <canvas id="canvas" width="640" height="480" /></canvas> <!-- キャンバスの設置 -->
    <img id="haikei" src="haikei.png" style="display:none" /> <!-- 背景画像おき場 -->
    <img id="you_win" src="you_win.png" style="display:none" /> <!-- 背景画像おき場 -->
    <img id="you_lose" src="you_lose.png" style="display:none" /> <!-- 背景画像おき場 -->
    <img id="gu" src="janken_gu.png" style="display:none" /> <!-- ぐー画像おき場 -->
    <img id="choki" src="janken_choki.png" style="display:none" /> <!-- ちょき画像おき場 -->
    <img id="pa" src="janken_pa.png" style="display:none" /> <!-- ぱー画像おき場 -->
    <img id="janken_key" src="janken_key.png" style="display:none" /> <!-- ぱー画像おき場 -->
    <img class="janken" src="janken_gu.png" style="display:none" />
    <img class="janken" src="janken_choki.png" style="display:none" />
    <img class="janken" src="janken_pa.png" style="display:none" />
    <img id="title" src="title.png" style="display:none" /> <!-- タイトル画像おき場 -->
  </body>
</html>
