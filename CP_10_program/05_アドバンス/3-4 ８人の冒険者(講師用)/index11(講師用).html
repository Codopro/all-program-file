//ゲームの開始の時にやること

    timers = setInterval(mainloop, timer) //タイマーを起動する
}

//クリックされた時にやること
function onclick_canvas(evt) {
    moused = mousezahyo(canvas, evt) //マウスの座標を得る
    if (mode === 0) { //タイトル画面？
        mode = 1 //プレイ画面にする
    } else if (mode === 1) { //プレイ画面？
        leaderbutton() //リーダーボタンがクリックされたらリーダーにする
        subleaderbutton() //リーダーボタンがクリックされたらサブリーダーにする
        memberbutton() //メンバーボタンがクリックされたらメンバーにする
        selectnum = charapage() //クリックされたキャラの番号を得る
        if (selectnum > -1) { //キャラがクリックされた？
            mode = 2 //キャラ画面にする
        }
        if (kettei()) { //決定した？
            mode = 8 //確認画面にする
        }
    } else if (mode === 2) { //キャラ画面？
        mode = 1 //プレイ画面に戻る
    } else if (mode === 8) { //確認画面？
        if (kettei()) { //決定した？
            kekkakeisan() //結果を計算する
            hyoukanum = kekkahyouka() //評価を決める
            mode = 9 //結果画面にする
        } else {
            mode = 1 //プレイ画面に戻る
        }
    } else if (mode === 9) { //結果画面？
        compkekka() //コンピュータの計算結果を得る
    }
}

//一定時間おきにやること
function mainloop() {
    draw() //画面を描く処理を呼ぶ
}

//結果を計算する
function kekkakeisan() {
    unplustakarabako() //【追加】運の強さの分の宝箱の数を得る
    ptakarabako[0] = leadertakarabako() //リーダーの宝箱の数を計算
    ptakarabako[1] = subleadertakarabako() //サブリーダーの宝箱の数を計算
    ptakarabako[2] = membertakarabako() //メンバーの宝箱の数を計算
    playerkei = ptakarabako[0] + ptakarabako[1] + ptakarabako[2] //プレイヤーの宝箱数合計
    cunplustakarabako() //【追加】コンピュータ用に運の強さの分の宝箱の数を得る
    comptakarabako() //コンピュータがベストメンバーを選んで宝箱の数を計算
}

//画面をえがく
function draw() {
    ctx.fillStyle = 'Yellow' //文字を黄色に
    if (mode === 0) { //タイトル画面？
        for (let j = 0; j < 3; j++) { //縦３行でくり返す
            for (let i = 0; i < 3; i++) { //横３列でくり返す
                if (i !== 1 || j !== 1) { //中央でなければ
                    ctx.drawImage(base[0], i * 210, j * 160) //背景画像[0]を表示
                } else {
                    ctx.drawImage(guides[0], i * 210, j * 160) //中央はガイド画像[0]を表示
                }
            }
        }
    } else if (mode === 1) { //プレイ画面？
        for (let j = 0; j < 3; j++) { //縦３行でくり返す
            for (let i = 0; i < 3; i++) { //横３列でくり返す
                if (i !== 1 || j !== 1) {
                    drawplay(i, j) //プレイ画面をえがく
                    drawplayun(i, j) //【追加】うんのつよさをえがく
                } else {
                    ctx.drawImage(guides[1], i * 210, j * 160) //中央はガイド画像[2]を表示
                }
            }
        }
    } else if (mode === 2) { //キャラ画面？
        ctx.font = '60pt Arial' //文字サイズを指定
        haikei9() //背景に９枚の画像を並べる
        ctx.drawImage(chara[selectnum], 0, 0, 420, 320) //キャラ画像[0～7]
        ctx.fillText(powers[selectnum], 5, 65) //その上にパワーを表示
        ctx.drawImage(unnotuyosa[untuyosav[selectnum]], 0, 320) //【追加】左下に運の強さの説明画像を表示
        ctx.drawImage(yakuwarib[0], 420, 0) //右上に役割と倍率画像を表示
        ctx.drawImage(guides[3], 420, 320) //左下にガイド画像[3]を表示
    } else if (mode === 8) { //確認画面？
        ctx.drawImage(guides[2], 210,160) //中央にガイド画像[2]を表示
    } else if (mode === 9) { //結果画面？
        haikei9() //背景に９枚の画像を並べる
        kekkaguide() //結果画面にガイドを表示
        ctx.font = '24pt Arial' //文字サイズを指定
        drawleaderk() //結果画面にリーダの情報を表示する
        drawsubleaderk() //結果画面にサブリーダの情報を表示する
        drawmemberk() //結果画面にメンバーの情報を表示する
        drawkekka(playerkei) //プレイヤーの宝箱数の合計数を画像付きで表示
        ctx.drawImage(hyouka[hyoukanum], 420, 160) //右中に評価[評価番号]を表示
    }
}
