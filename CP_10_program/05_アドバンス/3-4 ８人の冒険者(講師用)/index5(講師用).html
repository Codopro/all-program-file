<script type="text/javascript">

//ゲームの開始の時にやること
function start() {
    timers = setInterval(mainloop, timer) //タイマーを起動する
}

//クリックされた時にやること
function onclick_canvas(evt) {
    moused = mousezahyo(canvas, evt) //マウスの座標を得る
}

//一定時間おきにやること
function mainloop() {
    draw() //画面を描く処理を呼ぶ
}

//画面をえがく
function draw() {
    ctx.fillStyle = 'Yellow' //文字を黄色に
    if (mode === 0) { //【追加】タイトル画面？
        for (let j = 0; j < 3; j++) { //縦３行でくり返す
            for (let i = 0; i < 3; i++) { //横３列でくり返す
                if (i !== 1 || j !== 1) { //中央でなければ
                    ctx.drawImage(base[0], i * 210, j * 160) //宝箱画像[0]を表示
                } else { //【追加】
                    ctx.drawImage(guides[0], i * 210, j * 160) //【追加】中央はガイド画像[0]を表示
                } //【追加】
            }
        }
    } //【追加】
}
</script>
