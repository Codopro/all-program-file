function start() {
    timers = setInterval(mainloop, timer)
}

function onclick_canvas(evt) {
    moused = mousezahyo(canvas, evt)
    if (mode === 0) {
        mode = 1
    } else if (mode === 1) {
        selectnum = charapage()
        if (selectnum > -1) {
            mode = 2
        }
    } else if (mode === 2) {
        mode = 1
    }
}

function mainloop() {
    draw()
}

function draw() {
    ctx.fillStyle = 'Yellow'
    if (mode === 0) {
        for (let j = 0; j < 3; j++) {
            for (let i = 0; i < 3; i++) {
                if (i !== 1 || j !== 1) {
                    ctx.drawImage(base[0], i * 210, j * 160)
                } else {
                    ctx.drawImage(guides[0], i * 210, j * 160)
                }
            }
        }
    } else if (mode === 1) {
        for (let j = 0; j < 3; j++) {
            for (let i = 0; i < 3; i++) {
                if (i !== 1 || j !== 1) {
                    drawplay(i, j)
                } else {
                    ctx.drawImage(guides[1], i * 210, j * 160)
                }
            }
        }
    } else if (mode === 2) {
        ctx.font = '60pt Arial'
        haikei9()
        ctx.drawImage(chara[selectnum], 0, 0, 420, 320)
        ctx.fillText(powers[selectnum], 5, 65)
        ctx.drawImage(yakuwarib[0], 420, 0)
        ctx.drawImage(guides[3], 420, 320)
    }
}
