<script type="text/javascript">
//9.スペースキーで順序を変えられるようにしよう

//ゲームの開始の時にやること
function start() {
    timerno = setInterval(mainloop, timer) //タイマーを起動する
}

//キーをおし終えた時にやること
function keyUp(evt) {
    if (mode === 0 && evt.keyCode === 13) { //タイトルモードでEnterキーが押されたら
        for (let i = 0; i < 6; i++) { //すべての予告についてくり返す
            setyokoku(i) //予告をセットして落下するスライムズにコピーする
        }
        mode = 5 //プレイモードにする
    }
}

//キーがおされた時にやること
function keyDown(evt) {
    if (mode === 5) { //プレイモードならば
        if (evt.keyCode === 37 && slimexy.x >= slimesize) { //←キーが押されステージの左端ではなかったら
            moveleft() //落下中スライムズの左側にスライムがいなければ左に動かす
        } else if (evt.keyCode === 39 && slimexy.x < slimesize * 5) { //→キーが押されステージの右端ではなかったら
            moveright() //落下中スライムズの右側にスライムがいなければを右に動かす
        } else if (evt.keyCode === 32) { //【以下追加】スペースキーが押されたら
            let temp = slimes[0]  //１つめのスライムをたいひしておいて
            slimes[0] = slimes[1] //２つめのスライムを１つめへ
            slimes[1] = slimes[2] //３つめのスライムを２つめへ
            slimes[2] = temp //たいひしてあった１つめのスライムを３つめへ
        }
    }
}

//一定時間おきにやること
function mainloop() {
    if (mode === 5) { //プレイモードならば
        if (canslimefall()) { //落下中スライムズがさらに落下できるならば
            let py = slimexy.y //落下させる前のY座標を取っておく
            slimexy.y = slimesize / falldiv + slimexy.y //スライムズを落下させる
            if (py < 0 && slimexy.y >= 0) { //ちょうど落下中スライムズが全て表示されたら
                setnewyokoku() //予告を前にずらして新しい予告をセットする
            }
        } else { //もう落下できなければ
            if (slimexy.y < 0) { //落下中スライムズが表示しきれくなっていたら
                mode = 9 //ゲームオーバーモードにする
                return //この空いて抜ける
            }
            endslimefall() //落下中スライムズをステージマップにセットして次のスライムズを用意する
        }
    }
    draw() //画面をえがく
}

//はいけい、ステージ、タイトルなどをえがく
function drawfield() {
    drawhaikei() //はいけい画像を表示
    ctx.drawImage(stage, stagex, 0) //ステージ画像を表示
    ctx.drawImage(title, 320, 40) //タイトル画像を表示
    drawyokoku() //予告を表示する
}

//画面をえがく
function draw() {
    if (mode === 0) { //タイトルモードなら
        drawhaikei() //はいけい画像を表示
        ctx.drawImage(titleback, 150, 16, 340, 448) //タイトルバック画像を表示
        for (let i = 0; i < 8; i++) { //８回くり返す
            if (i < 3) { //i=0,1,2ならば
                ctx.drawImage(slimeb[i], 218, 68 * i + 16) //スライム画像タイトル用[0]～[2]を表示
            } else if (i < 6) { //i=3,4,5ならば
                ctx.drawImage(slimeb[i], 286, 68 * i + 56) //スライム画像タイトル用[3]～[5]を表示
            } else { //i=6,7ならば
                ctx.drawImage(slimeb[5], 68 * i - 54, 396) //スライム画像タイトル用[5]を表示
            }
        }
    } else if (mode === 5 || mode === 9) { //プレイモードまたはゲームオーバーモードならば
        drawfield() //はいけい、ステージ、タイトルなどをえがく
        drawslimes() //落下中のスライムズをえがく
        drawstageslime() //ステージ上のスライムを表示する
    }
    if (mode === 9) { //ゲームオーバーモードならば
        drawgameover() //ゲームオーバーを表示
    }
}
</script>
