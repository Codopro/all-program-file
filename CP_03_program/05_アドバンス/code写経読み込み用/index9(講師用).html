<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<script type="text/javascript" src="parts.js"></script>
<script type="text/javascript">



function start() {
    timerno = setInterval(mainloop, timer) 
}


function keyUp(evt) {
    if (mode === 0 && evt.keyCode === 13) { 
        for (let i = 0; i < 6; i++) { 
            setyokoku(i) 
        }
        mode = 5 
    }
}


function keyDown(evt) {
    if (mode === 5) { 
        if (evt.keyCode === 37 && slimexy.x >= slimesize) { 
            moveleft() 
        } else if (evt.keyCode === 39 && slimexy.x < slimesize * 5) { 
            moveright() 
        } else if (evt.keyCode === 32) {             let temp = slimes[0]  
            slimes[0] = slimes[1] 
            slimes[1] = slimes[2] 
            slimes[2] = temp 
        }
    }
}


function mainloop() {
    if (mode === 5) { 
        if (canslimefall()) { 
            let py = slimexy.y 
            slimexy.y = slimesize / falldiv + slimexy.y 
            if (py < 0 && slimexy.y >= 0) { 
                setnewyokoku() 
            }
        } else { 
            if (slimexy.y < 0) { 
                mode = 9 
                return 
            }
            endslimefall() 
        }
    }
    draw() 
}


function drawfield() {
    drawhaikei() 
    ctx.drawImage(stage, stagex, 0) 
    ctx.drawImage(title, 320, 40) 
    drawyokoku() 
}


function draw() {
    if (mode === 0) { 
        drawhaikei() 
        ctx.drawImage(titleback, 150, 16, 340, 448) 
        for (let i = 0; i < 8; i++) { 
            if (i < 3) { 
                ctx.drawImage(slimeb[i], 218, 68 * i + 16) 
            } else if (i < 6) { 
                ctx.drawImage(slimeb[i], 286, 68 * i + 56) 
            } else { 
                ctx.drawImage(slimeb[5], 68 * i - 54, 396) 
            }
        }
    } else if (mode === 5 || mode === 9) { 
        drawfield() 
        drawslimes() 
        drawstageslime() 
    }
    if (mode === 9) { 
        drawgameover() 
    }
}
</script>
