<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<script type="text/javascript" src="parts.js"></script>
<script type="text/javascript">
//8.ヒント（周囲のばくだん数）を表示しよう

//ゲームの開始の時にやること
function start() {
    timerno = setInterval(mainloop, timer) //タイマーを起動する
}

//クリックされた時にやること
function onclick_canvas(evt) {
    mouse = mousezahyo(canvas, evt) //マウスの座標を得る
    if (mode === 0) { //タイトルモードならば
        setmap() //マップを用意する
        setbomb(bombs) //ばくだんをセットする
        for (let i = 0; i < cols; i++) { //【以下追加】列数の分だけくり返す
            for (let j = 0; j < cols; j++) { //行数の分だけくり返す
                if (map[i][j] !== 9) { //ばくだんでなければ
                    map[i][j] = getbnums(i, j) //周囲のばくだん数をセットする
                }
            }
        }
        mode = 5 //プレイモードにする
    } else if (mode === 5) { //プレイモードならば
        let mapxy = getmousemap(mouse) //マップのどこがクリックされたかを得る
        if (mapxy.x >= 0 && vmap[mapxy.x][mapxy.y] === -2) { //クリックされたのが箱ならば
            vmap[mapxy.x][mapxy.y] = map[mapxy.x][mapxy.y] //箱を開いて中を表示する
            if (map[mapxy.x][mapxy.y] === 9) { //ばくだんならば
                for (let i = 0; i < cols; i++) { //列数の分だけくり返す
                    for (let j = 0; j < cols; j++) { //行数の分だけくり返す
                        vmap[i][j] = map[i][j] //種明かし
                    }
                }
                mode = 9 //ゲームオーバーモードにする
            }
        }
    }
}

//一定時間おきにやること
function mainloop() {

    draw() //画面をえがく処理を呼ぶ
}

//箱・タイトル・ばくだん数・フラグ数をえがく
function drawitem() {
    for (let i = 0; i < cols; i++) { //列数の分だけくり返す
        for (let j = 0; j < cols; j++) { //行数の分だけくり返す
            drawbox(i, j, vmap[i][j]) //その位置の状態の箱画像を表示
        }
    }
    ctx.drawImage(title, 490, 33, 120, 120) //タイトルを表示
    ctx.drawImage(bombflag, 490, 180, 120, 120) //ばくだん数とフラグ数の画像を表示
    drawbombs(bombs) //ばくだん数を表示
}

//画面をえがく
function draw() {
    if (mode === 0) { //タイトルモードなら
        for (let i = 0; i < 3; i++) { //横に3回くり返す
            for (let j = 0; j < 3; j++) { //縦に3回くり返す
                if (i + j <= 1) { //i,jが(0,0)(1,0)(0,1)ならば
                    ctx.drawImage(box, 160 * i, 160 * j, 160, 160) //箱画像を表示
                } else if (i === 1 && j === 1) { //i,jが(1,1)ならば
                    ctx.drawImage(titlebox, 160 * i, 160 * j, 160, 160) //タイトル箱画像を表示
                } else { //i,jが(0,2)(1,2)(2,0)(2,1)(2,2)ならば
                    ctx.drawImage(bomb, 160 * i, 160 * j, 160, 160) //爆弾画像を表示
                }
            }
        }
    } else if (mode === 5) { //プレイモードならば
        ctx.drawImage(haikei[0], 0, 0) //はいけい[0]画像を表示
        drawitem() //箱・タイトル・ばくだん数・フラグ数をえがく
        ctx.drawImage(msg[0], 490, 325, 120, 120) //メッセージ[0]画像を表示
    } else if (mode === 9) { //ゲームオーバーモードならば
        ctx.drawImage(haikei[1], 0, 0) //はいけいを表示
        drawitem() //箱・タイトル・ばくだん数・フラグ数をえがく
        ctx.drawImage(msg[1], 490, 325, 120, 120) //メッセージ[1]画像を表示
    }
}
</script>
