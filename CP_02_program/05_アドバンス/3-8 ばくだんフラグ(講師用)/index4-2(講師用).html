<script type="text/javascript">

//ゲームの開始の時にやること
function start() {
    timerno = setInterval(mainloop, timer) //タイマーを起動する
}

//クリックされた時にやること
function onclick_canvas(evt) {
    mouse = mousezahyo(canvas, evt) //マウスの座標を得る

}

//一定時間おきにやること
function mainloop() {

    draw() //画面をえがく処理を呼ぶ
}

//箱・タイトル・ばくだん数・フラグ数をえがく
function drawitem() {

}

//画面をえがく
function draw() {
	for (let i = 0; i < 3; i++) { //横に3回くり返す
		for (let j = 0; j < 3; j++) { //縦に3回くり返す
			if (i + j <= 1) { //
				ctx.drawImage(box, 160 * i, 160 * j, 160, 160) //箱画像を表示
			} else if (i === 1 && j === 1) { //i,jが(1,1)ならば
			    ctx.drawImage(titlebox, 160 * i, 160 * j, 160, 160) //タイトル箱画像を表示
			} else { //i,jが(0,2)(1,2)(2,0)(2,1)(2,2)ならば
			    ctx.drawImage(bomb, 160 * i, 160 * j, 160, 160) //爆弾画像を表示
			}
		}
	}
}
</script>
