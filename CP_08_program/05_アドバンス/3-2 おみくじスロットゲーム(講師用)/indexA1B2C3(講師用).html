<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<script type="text/javascript">
let back = document.getElementsByClassName("back") ;
let kujibako = document.getElementsByClassName("kujibako") ;
let kuji = document.getElementsByClassName("kuji") ;

//固定データ（変わらないデータ）
let window1 = { sx:640, sy:480 } //ウィンドウの横の長さと縦の長さ
let timer = 20 //ゲームの実行タイマー(小さいと速い)
let kujino = 7 //クジの数
let slotno = 3 //スロットの数
let timers //タイマー用
let kujis = [
    "omikuji_daikichi",
    "omikuji_chuukichi",
    "omikuji_syoukichi",
    "omikuji_kichi",
    "omikuji_suekichi",
    "omikuji_kyou",
    "omikuji_daikyou",
] //クジのリスト
let sounds = [] //効果音のリスト
let tsugi = [1, 2, 3, 4, 5, 6, 0] //次のクジの番号のリスト

//作業データ（ゲームの状態によって値が変わります）
let imakuji = [0, 1, 2, 3, 4, 5, 6] //今のクジの番号
let mode = 0 //ゲームの状態（0:タイトル画面,9:結果画面）
let kekkas = [0, 0, 0] //クジの結果×3（0:大吉 1:中吉 2:小吉 3:吉 4:末吉 5:凶 6:大凶）
let kujihyojis = [0, 0, 0] //表示中のクジ番号×3
let kujitime = 0 //クジの表示タイマー
let kujibakohyoji = 0 //表示中のクジ箱番号
let kujiy = 0 //クジの表示開始位置
let heikin = 0 //【追加】クジの平均点

//最初に１回だけやること（起動処理）
function init() {
    ctx = document.getElementById('canvas').getContext('2d') //プログラムと画面（コンテント）をつなぐ
    addEventListener('keydown', keyDown, true) //キーが押し終わった時にやることを示す
    addEventListener('keyup', keyUp, true) //キーが押された時にやることを示す
    for (let i = 0; i < kujino; i++) { //クジの全種類についてくり返す
        sounds[i] = new Audio(kujis[i] + ".mp3") //効果音を読み込む
        sounds[i].preload = "auto" //音が自動で流れるようにセットする
        sounds[i].load() //効果音を読み込んでおく
    }
    start() //開始処理を呼ぶ
}

//ゲームの開始の時にやること（開始処理）
function start() {
    for (let i = 0; i < 10; i++) { //10回くり返す
        let kuji1 = Math.floor(Math.random() * 6) + 1 //交換するクジ①を決める
        let kuji2 = Math.floor(Math.random() * 6) + 1 //交換するクジ②を決める
        if (kuji1 !== kuji2) { //交換するクジ①と②がちがうものになったら？
            let taihi = imakuji[kuji1]      //クジ番号①と
            imakuji[kuji1] = imakuji[kuji2] //クジ番号②を
            imakuji[kuji2] = taihi          //交換する
        }
    }
    timers = setInterval(mainloop, timer) //タイマーを起動する
}

//キーが押し終わった時にやること
function keyUp(evt) {
    if (mode === 0) { //タイトル画面？
        if (evt.keyCode === 13) { //Enterキー？
            for(let i = 0; i < slotno; i++) { //3回くり返す
                kekkas[i] = Math.floor(Math.random() * kujino) //クジを決める
                kujihyojis[i] = tsugi[kekkas[i]] //決まったクジの次から表示開始
            }
            kujitime = 10 //クジの表示タイマーをセット
            mode = 8 //クジ箱アニメーションへ
        }
    }
    if (mode === 1) { //パラパラ画面？
        if (evt.keyCode === 32) { //Spaceキー？
            for(let i = 0; i < slotno; i++) { //3回くり返す
                kekkas[i] = tsugi[kujihyojis[i]] //下に表示中の次のクジを結果とする
            }
            kujitime = 10 //クジの表示タイマーをセット
            mode = 3 //ゆっくり停止へ
        }
    }
}

//キーが押された時にやること
function keyDown(evt) {
}

//ゲーム中一定時間おきにやること
function mainloop() {
    if (mode === 8) { //クジ箱アニメーション？
        kujitime-- //クジの表示タイマーカウントダウン
        if (kujitime <= 0) { //カウントゼロ？
            kujibakohyoji++ //次のクジ箱を表示
            kujitime = 10 //クジの表示タイマーをセット
        }
        if (kujibakohyoji > 3) { //アニメーション終り？
            kujitime = 10 //クジの表示タイマーをセット
            mode = 1 //パラパラ画面へ
        }
    }
    if (mode === 1) { //パラパラ画面？
        kujitime-- //クジの表示タイマーのカウントダウン
        if (kujitime <= 0) { //カウントゼロ？
            kujiy++ //クジの表示位置を変える
            kujitime = 3 //クジの表示タイマーをセット
        }
        if(kujiy >= 5) { //5回動いたら
            kujiy = 0 //元の位置に戻す
            for(let i = 0; i < slotno; i++) { //3回くり返す
                kujihyojis[i] = tsugi[kujihyojis[i]] //次のクジを表示
            }
        }
    }
    if (mode === 3) { //ゆっくり停止中？
        kujitime-- //クジの表示タイマーカウントダウン
        if (kujitime <= 0) { //カウントゼロ？
            kujiy++ //クジの位置を変える
            kujitime = 5 //クジの表示タイマーをセット
        }
        if(kujiy >= 5) { //5回分動いたら
            mode = 7 //ゆっくり停止完了
        }
    }
    if (mode === 7) { //ゆっくり停止完了？
        let gokei = 0 //【追加】合計点
        for(let i = 0; i < slotno; i++) { //【以下追加】3スロットの分くり返す
            gokei += imakuji[kekkas[i]] //結果をポイントにして合計に加える
        }
        heikin = Math.floor(gokei / slotno) //【変更】平均点を得て小数点以下切り捨て
        let konkai = heikin //【変更】今回の音を平均点とする
        sounds[konkai].currentTime = 0 //効果音の準備
        sounds[konkai].play() //効果音を流す
        mode = 9 //結果画面へ
    }
    draw() //画面を描く処理を呼ぶ
}

//画面を描く処理
function draw() {
    if (mode === 0) { //タイトル画面？
        ctx.drawImage(back[0], 0, 0) //背景の画像を表示
        ctx.drawImage(kujibako[0], 0, 0) //くじ箱[0]の画像を表示
        for (let i = 1; i <= 6; i++) { //i=1,2,3,4,5,6についてくり返す
            let konkai = imakuji[i] //今回のクジを得る
            if (i <= 3) {
                ctx.drawImage(kuji[konkai], 210, 6 + i * 110, 50, 110) //今回のクジ[1,2,3]の画像を表示
            } else {
                ctx.drawImage(kuji[konkai], 365, 6 + (i - 3) * 110, 50, 110) //今回のクジ[4,5,6]の画像を表示
            }
        }
    } else if (mode === 8) { //クジ箱アニメーション？
        ctx.drawImage(back[0], 0, 0) //背景の画像を表示
        ctx.drawImage(kujibako[kujibakohyoji], 0, 0) //くじ箱[動作中]の画像を表示
    } else if (mode === 1 || mode === 3) { //パラパラ画面～ゆっくり停止中？
        ctx.drawImage(spacer, 115, 116, 110, 230) //クジの位置に下敷きの画像①を表示  
        ctx.drawImage(spacer, 225, 116, 110, 230) //クジの位置に下敷きの画像②を表示  
        ctx.drawImage(spacer, 335, 116, 110, 230) //クジの位置に下敷きの画像③を表示  
        let konkai = imakuji[kujihyojis[0]] //今表示中のクジ①を得る
        ctx.drawImage(kuji[konkai], 115, 116 - kujiy * 46, 110, 230) //クジ①の画像（上）を表示
        let konotugi = imakuji[tsugi[kujihyojis[0]]] //今表示中のクジ①の次のクジを得る
        ctx.drawImage(kuji[konotugi], 115, 346 - kujiy * 46, 110, 230) //クジ①の画像（下）を表示
        konkai = imakuji[kujihyojis[1]] //表示中のクジ②を得る
        ctx.drawImage(kuji[konkai], 225, 116 + kujiy * 46, 110, 230) //クジ②の画像（上）を表示
        konotugi = imakuji[tsugi[kujihyojis[1]]] //今表示中のクジ②の次のクジを得る
        ctx.drawImage(kuji[konotugi], 225, -114 + kujiy * 46, 110, 230) //クジ②の画像（下）を表示
        konkai = imakuji[kujihyojis[2]] //今表示中のクジ③を得る
        ctx.drawImage(kuji[konkai], 335, 116 - kujiy * 46, 110, 230) //クジ③の画像（上）を表示
        konotugi = imakuji[tsugi[kujihyojis[2]]] //今表示中のクジ③の次のクジを得る
        ctx.drawImage(kuji[konotugi], 335, 346 - kujiy * 46, 110, 230) //クジ③の画像（下）を表示
        ctx.drawImage(back[1], 0, 0) //背景＋くじ箱の画像を表示
    } else if (mode === 9) { //結果画面？
        if(heikin === 0) { //【変更】平均点が大吉？
            ctx.drawImage(back[2], 0, 0) //背景[大吉]の画像を表示
        } else { //それ以外？
            ctx.drawImage(back[0], 0, 0) //背景の画像を表示
        }
        ctx.drawImage(kujibako3slot, 0, 0) //くじ箱(スロット3つ用)の画像を表示
        let konkai = imakuji[kekkas[0]] //今回のクジ①(結果)を得る
        ctx.drawImage(kuji[konkai], 115, 116, 110, 230) //今回のクジ①の画像を表示  
        konkai = imakuji[kekkas[1]] //今回のクジ②(結果)を得る
        ctx.drawImage(kuji[konkai], 225, 116, 110, 230) //今回のクジ②の画像を表示  
        konkai = imakuji[kekkas[2]] //今回のクジ③(結果)を得る
        ctx.drawImage(kuji[konkai], 335, 116, 110, 230) //今回のクジ②の画像を表示  
    }
}

</script>
</head>
<body onload="init();"> <!-- 最初に１回だけやること（起動処理）を示す -->
<canvas id="canvas" width="640" height="480" /></canvas> <!-- キャンバスの設置 -->
<img class="back" src="back.png" style="display:none;" /> <!-- 背景の画像おき場 -->
<img class="back" src="back3.gif" style="display:none;" /> <!--背景＋くじ箱の画像おき場 -->
<img class="back" src="backdaikichi.png" style="display:none" /> <!-- 背景(大吉)の画像おき場 -->
<img class="kujibako" src="kujibako0.gif" style="display:none;" /> <!-- くじ箱(0)の画像おき場 -->
<img class="kujibako" src="kujibako1.gif" style="display:none;" /> <!-- くじ箱(1)の画像おき場 -->
<img class="kujibako" src="kujibako2.gif" style="display:none;" /> <!-- くじ箱(2)の画像おき場 -->
<img class="kujibako" src="kujibako3.gif" style="display:none;" /> <!-- くじ箱(3)の画像おき場 -->
<img id="kujibako3slot" src="kujibako4.gif" style="display:none;" /> <!-- くじ箱(3つ用)の画像おき場 -->
<img class="kuji" src="omikuji_daikichi.png" style="display:none;" /> <!-- 大吉の画像おき場 -->
<img class="kuji" src="omikuji_chuukichi.png" style="display:none;" /> <!-- 中吉の画像おき場 -->
<img class="kuji" src="omikuji_syoukichi.png" style="display:none;" /> <!-- 小吉の画像おき場 -->
<img class="kuji" src="omikuji_kichi.png" style="display:none;" /> <!-- 吉の画像おき場 -->
<img class="kuji" src="omikuji_suekichi.png" style="display:none;" /> <!-- 末吉の画像おき場 -->
<img class="kuji" src="omikuji_kyou.png" style="display:none;" /> <!-- 凶の画像おき場 -->
<img class="kuji" src="omikuji_daikyou.png" style="display:none;" /> <!-- 大凶の画像おき場 -->
<img id="spacer" src="spacer.png" style="display:none;" /> <!--下じきの画像おき場 -->
</body>
</html>
