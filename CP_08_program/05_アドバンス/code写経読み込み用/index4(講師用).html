<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<script type="text/javascript">
let back = document.getElementsByClassName("back") ;
let kujibako = document.getElementsByClassName("kujibako") ;
let kuji = document.getElementsByClassName("kuji") ;

let window1 = { sx:640, sy:480 }
let timer = 20
let kujino = 7
let slotno = 1
let timers
let kujis = [
    "omikuji_daikichi",
    "omikuji_chuukichi",
    "omikuji_syoukichi",
    "omikuji_kichi",
    "omikuji_suekichi",
    "omikuji_kyou",
    "omikuji_daikyou",
]
let sounds = []

let mode = 0
let kekka = 0

function init() {
    ctx = document.getElementById('canvas').getContext('2d')
    addEventListener('keydown', keyDown, true)
    addEventListener('keyup', keyUp, true)
    for (let i = 0; i < kujino; i++) {
        sounds[i] = new Audio(kujis[i] + ".mp3")
        sounds[i].preload = "auto"
        sounds[i].load()
    }
    start()
}

function start() {
    timers = setInterval(mainloop, timer)
}

function keyUp(evt) {
}

function keyDown(evt) {
}

function mainloop() {
    draw()
}

function draw() {
    for (let i = 1; i <= 6; i++) {
        if (i <= 3) {
            ctx.drawImage(kuji[i], 210, 6 + i * 110, 50, 110)
        } else {
            ctx.drawImage(kuji[i], 365, 6 + (i - 3) * 110, 50, 110)
        }
    }
}

</script>
</head>
<body onload="init();">
<canvas id="canvas" width="640" height="480" /></canvas>
<img class="back" src="back.png" style="display:none" />

</body>
