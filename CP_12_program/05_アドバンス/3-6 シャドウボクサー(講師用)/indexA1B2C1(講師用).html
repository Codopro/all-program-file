<meta charset="utf-8" />
<script type="text/javascript" src="parts.js"></script>
<script type="text/javascript">

//ゲームの開始の時にやること
function start() {
    for (let i = 0; i < 4; i++) { //【B2：以下追加】全ての効果音についてくり返す
        oto[i] = new Audio("oto" + i + ".mp3") //ファイルを開く
        oto[i].preload = "auto" //音が自動で流れるようにセットする
        oto[i].load() //効果音を読み込んでおく
    }
    timerno = setInterval(mainloop, timer) //タイマーを起動する
}

//キーをおし終えた時にやること
function keyUp(evt) {
}

//キーがおされた時にやること
function keyDown(evt) {
    if (mode === 0 && evt.keyCode === 32) { //タイトル画面モードでスペースキーが押されていたら
        oto[0].currentTime = 0 //【B2:追加】効果音の準備
        oto[0].play() //【B2:追加】効果音を流す
        mode = 3 //【B1:変更】出現モードにする
    } else if (mode === 5) { //プレイモードならば
        if (evt.keyCode === 38) { //↑キーならば
            playernow = 0 //プレイヤーの状態を上構えにする
            playerpun = -1 //パンチマークを消す
        } else if (evt.keyCode === 40) { //↓キーならば
            playernow = 1 //プレイヤーの状態を下構えにする
            playerpun = -1 //パンチマークを消す
        } else if (evt.keyCode === 37 && playernow === 0) { //上構えで←キーならば
            playernow = 2 //プレイヤーの状態を上パンチにする
            if (shadownow === 0) { //敵が上構えならば
                playerpun = playertame //【C1:変更】ため数をパンチ力にする
                shadowdameged(playerpun) //敵にパンチがあたった時にやること
            } else {
                playerpun = -1 //パンチマークを消す
            }
        } else if (evt.keyCode === 37 && playernow === 1) { //下構えで←キーならば
            playernow = 3 //プレイヤーの状態を下パンチにする
            if (shadownow === 1) { //敵が下構えならば
                playerpun = playertame //【C1:変更】ため数をパンチ力にする
                shadowdameged(playerpun) //敵にパンチがあたった時にやること
            } else {
                playerpun = -1 //パンチマークを消す
            }
        } else if (evt.keyCode === 39 && playernow === 2) { //上パンチで→キーならば
            playernow = 0 //プレイヤーの状態を上構えにもどす
            playerpun = -1 //パンチマークを消す
        } else if (evt.keyCode === 39 && playernow === 3) { //下パンチで→キーならば
            playernow = 1 //プレイヤーの状態を下構えにもどす
            playerpun = -1 //パンチマークを消す
        }
        if (keycodep === 38 && evt.keyCode === 39) { //【C1:以下追加】↑→キーならば
            if (playertame < 3) { //ためが3未満ならば
                playertame = playertame + 1 //ためを1つ進める
                playertamehou = 0 //上かまえでためる
            }
        } else if (keycodep === 40 && evt.keyCode === 39) { //【C1:以下追加】↓→キーならば
            if (playertame < 3) { //ためが3未満ならば
                playertame = playertame + 1 //ためを1つ進める
                playertamehou = 1 //下かまえでためる
            }
        } else if (playertamehou === 0 && evt.keyCode === 40) { //【C1:以下追加】上かまえでためて↓キーならば
            playertame = 0 //ためを0に戻す
        } else if (playertamehou === 1 && evt.keyCode === 38) { //【C1:以下追加】下かまえでためて↑キーならば
            playertame = 0 //ためを0に戻す
        }
        if (mode === 8) { //【B2:追加】KO勝ちならば
            oto[2].currentTime = 0 //【B2:追加】効果音の準備
            oto[2].play() //【B2:追加】効果音を流す
        }
    }
    keycodep = evt.keyCode //【C1:追加】おされたキーコードを取っておく
}

//一定時間おきにやること
function mainloop() {
    if (mode === 3) { //【B1:以下追加】出現モードならば
        count = count - 0.2 //カウントダウンする
        if (count < 1.1) { //カウントダウン終了？
            count = 5.0 //カウンタを戻す
            mode = 4 //カウントダウンモードにする
        }
    } else if (mode === 4) { //【B1:変更】カウントダウンモードならば
        count = count - 0.05 //カウントダウンする
        if (count <= 0.0) { //カウントダウン終了？
            oto[1].currentTime = 0 //【B2:追加】効果音の準備
            oto[1].play() //【B2:追加】効果音を流す
            mode = 5 //プレイモードにする
        }
    } else if (mode === 5) { //プレイモードならば
        shadowcnt = shadowcnt - 1 //敵の動作カウントダウン
        if (shadowcnt <= 0) { //カウントダウン終了？
            shadowcnt = shadowcnti //敵の動作カウントを戻す
            shadowcnt = shadowcnt - (100 - shadowpow) / 10 //【A1:追加】敵はパワーがへった分だけ速くなる
            if (shadownow === 0 && playernow === 0) { //敵もプレイヤーも上かまえなら
                shadownow = 2 //敵の状態を上パンチにする
                shadowpun = 0 //パンチマークをセット
                playerdameged(shadowpun) //プレイヤーにパンチがあたった時にやること
                playertame = 0 //【C1:追加】ため0に戻す
            } else if (shadownow === 1 && playernow === 1) { //敵もプレイヤーも下かまえなら
                shadownow = 3 //敵の状態を下パンチにする
                shadowpun = 0 //パンチマークをセット
                playerdameged(shadowpun) //プレイヤーにパンチがあたった時にやること
                playertame = 0 //【C1:追加】ため0に戻す
            } else if (Math.random() < 0.5) { //50%の確率で
                shadownow = 0 //敵の状態を上かまえにする
                shadowpun = -1 //パンチマークを消す
            } else {
                shadownow = 1 //敵の状態を下かまえにする
                shadowpun = -1 //パンチマークを消す
            }
        }
        if (mode === 9) { //【B2:追加】KO負けならば
            oto[3].currentTime = 0 //【B2:追加】効果音の準備
            oto[3].play() //【B2:追加】効果音を流す
        } //【B2:追加】
    }
    draw() //画面をえがく
}

//試合をえがく
function drawact() {
    ctx.drawImage(haikei, 0, 0) //背景画像を表示
    if (mode === 3) { //【B1:追加】出現モードならば
        drawshadow(shadowno, shadownow, count) //【B1:追加】敵画像をちぢめて表示
    } else { //【B1:追加】カウントダウンモード以降ならば
        drawshadow(shadowno, shadownow) //敵画像を表示
    } //【B1:追加】
    drawplayer(playernow) //プレイヤー画像を表示
    if (mode >= 5) { //プレイモード以降ならば
        drawplayerg(playerpow) //プレイヤーのパワーメーターを表示
        drawplayert(playertame) //【C1:追加】プレイヤーのためを表示
        drawshadowg(shadowpow) //敵のパワーメーターを表示
        if (playerpun >= 0) { //プレイヤーのパンチが当たっているなら
            drawshadowpun(playerpun) //敵にパンチマークを表示
        }
        if (shadowpun >= 0) { //敵のパンチが当たっているなら
            drawplayerpun(shadowpun) //プレイヤーにパンチマークを表示
        }
    }
    drawname(shadowno) //プレイヤーと敵の名前を表示
}

//画面をえがく
function draw() {
    if (mode === 0) { //タイトルモードならば
        ctx.drawImage(title, 0, 0) //タイトル画像を表示
        for (let i = 0; i < 6; i++) {
            if(i < 3) {
                ctx.drawImage(fireimg, 60 + 40 * i, 275) //左の炎画像を表示
            } else {
                ctx.drawImage(fireimg, 345 + 40 * i, 275) //右の炎画像を表示
            }
        }
    } else if (mode === 3) { //【B1:以下追加】出現モードならば
        drawact() //試合をえがく
    } else if (mode === 4) { //カウントダウンモードならば
        drawact() //試合をえがく
        drawcount(count) //カウントをえがく
    } else if (mode === 5) { //プレイモードならば
        drawact() //試合をえがく
    } else if (mode === 8) { //KO勝ちモードならば
        drawact() //試合をえがく
        drawmessage("KO!!") //KO勝ちのメッセージを表示
    } else if (mode === 9) { //KO負けモードならば
        drawact() //試合をえがく
        drawmessage("KO...") //KO負けのメッセージを表示
        ctx.fillText("Game Over", 170, 470) //「Game Over」を表示
    }
}
</script>
