<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<script type="text/javascript" src="parts.js"></script>
<script type="text/javascript">
function start() {
    timerno = setInterval(mainloop, timer) 
}

function keyUp(evt) {
}

function keyDown(evt) {
    if (mode === 0 && evt.keyCode === 32) { 
        mode = 4 
    } else if (mode === 5) { 
        if (evt.keyCode === 38) { 
            playernow = 0 
            playerpun = -1 
        } else if (evt.keyCode === 40) { 
            playernow = 1 
            playerpun = -1 
        } else if (evt.keyCode === 37 && playernow === 0) {
            playernow = 2 
            if (shadownow === 0) { 
                playerpun = 0 
                shadowdameged(playerpun) 
            } else {
                playerpun = -1 
            }
        } else if (evt.keyCode === 37 && playernow === 1) { 
            playernow = 3 
            if (shadownow === 1) { 
                playerpun = 0 
                shadowdameged(playerpun) 
            } else {
                playerpun = -1 
            }
        } else if (evt.keyCode === 39 && playernow === 2) { 
            playernow = 0 
            playerpun = -1 
        } else if (evt.keyCode === 39 && playernow === 3) { 
            playernow = 1 
            playerpun = -1 
        } 
    } 
}
function mainloop() {
    if (mode === 4) { 
        count = count - 0.05 
        if (count <= 0.0) { 
            mode = 5 
        }
    } else if (mode === 5) { 
        shadowcnt = shadowcnt - 1 
        if (shadowcnt <= 0) { 
            shadowcnt = shadowcnti 
            if (shadownow === 0 && playernow === 0) { 
                shadownow = 2 
                shadowpun = 0 
                playerdameged(shadowpun) 
            } else if (shadownow === 1 && playernow === 1) { 
                shadownow = 3 
                shadowpun = 0 
                playerdameged(shadowpun) 
            } else if (Math.random() < 0.5) { 
                shadownow = 0 
                shadowpun = -1 
            } else {
                shadownow = 1 
                shadowpun = -1 
            }
        }
    }
    draw() }
function drawact() {
    ctx.drawImage(haikei, 0, 0) 
    drawshadow(shadowno, shadownow) 
    drawplayer(playernow) 
    if (mode >= 5) { 
        drawplayerg(playerpow) 
        drawshadowg(shadowpow) 
        if (playerpun >= 0) { 
            drawshadowpun(playerpun) 
        }
        if (shadowpun >= 0) { 
            drawplayerpun(shadowpun) 
        }
    }
    drawname(shadowno) 
}
function draw() {
    if (mode === 0) { 
        ctx.drawImage(title, 0, 0) 
        for (let i = 0; i < 6; i++) {
            if(i < 3) {
                ctx.drawImage(fireimg, 60 + 40 * i, 275) 
            } else {
                ctx.drawImage(fireimg, 345 + 40 * i, 275) 
            }
        }    
    } else if (mode === 4) { 
        drawact() 
        drawcount(count) 
    } else if (mode === 5) { 
        drawact() 
    } else if (mode === 8) { 
        drawact() 
        drawmessage("KO!!") 
    } else if (mode === 9) { 
        drawact() 
        drawmessage("KO...") 
        ctx.fillText("Game Over", 170, 470) 
    }
}
</script>

</head>
<body onload="init();">
