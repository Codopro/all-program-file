<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<script type="text/javascript" src="parts.js"></script>
<script type="text/javascript">

function start() {
    timerno = setInterval(mainloop, timer)
}

function keyUp(evt) {
}

function keyDown(evt) {
    if (mode === 0 && evt.keyCode === 32) {
        mode = 4
    }
}

function mainloop() {
    if (mode === 4) { 
        count = count - 0.05
        if (count <= 0.0) {
            mode = 5
        }
    }
    draw()
}

function drawact() {
    ctx.drawImage(haikei, 0, 0)
    drawshadow(shadowno, shadownow)
    drawplayer(playernow)
    if (mode >= 5) {
        drawplayerg(playerpow)
        drawshadowg(shadowpow)
    }
    drawname(shadowno)
}

function draw() {
    if (mode === 0) {
        ctx.drawImage(title, 0, 0)
        for (let i = 0; i < 6; i++) {
            if(i < 3) {
                ctx.drawImage(fireimg, 60 + 40 * i, 275)
            } else {
                ctx.drawImage(fireimg, 345 + 40 * i, 275)
            }
        }    
    } else if (mode === 4) {
        drawact()
        drawcount(count)
    } else if (mode === 5) {
        drawact()
    }
}
</script>

</head>
<body onload="init();">
