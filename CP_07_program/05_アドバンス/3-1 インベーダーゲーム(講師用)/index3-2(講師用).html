<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<!-- ここからJavaScriptプログラム -->
<script type="text/javascript" src="./parts.js"></script>
<script type="text/javascript">
//固定データ（変わらないデータ）
let timer = 20 //主処理を呼ぶタイマーの実行間隔
//自機のX座標, Y座標, 幅, 高さ, 速度
let player = { x:300, y:395, sx:40, sy:40, mx:10 }
//敵機[0]のX座標, Y座標, 幅, 高さ, X速度, Y速度
let teki = { x:10, y:70, sx:60, sy:60, mx:1, my:10 }
//自弾の幅, 高さ, 速度
let tama = { sx:20, sy:20, mx:10 }

//作業データ（ゲームの状態によって値が変わります）
let mode = 0 //ゲームの状態（0:タイトル画面,1:プレイ画面,9:ゲームオーバー画面）
let tamaf = 0 //自弾有無
let tekinum = 32 //敵機残数
let tekia = [] //敵機のリスト
let kougeki = 0 //自弾が発射されているか？
let hidari = 0 //左キーが押されている？
let migi = 0 //右キーが押されている？

//キーをおし終えた時のしょり
function keyUp(evt) {

}

//キーがおされた時のしょり
function keyDown(evt) {

}

//ゲーム中一定時間おきに実行されるしょり
function mainloop() {

    draw() //画面を描く
}

//画面をえがくしょり
function draw() {

    ctx.fillStyle = ctx.createPattern(tekii, 'repeat') //敵機画像でパターンを作る
    for (let i = 0; i < 2; i++) { //i=0,1についてくり返す
        ctx.fillRect(300, 115 + i * 60, 60, 60) //パターンで四角形を描く
    } 

}
</script>
<!-- ここまでJavaScriptプログラム -->
</head>
<body onload="init();"> <!-- 始まる時の処理 -->
<canvas id="canvas" width="640" height="480" /></canvas> <!-- キャンバスの設置 -->
<img id="back1i" src="back1.png" style="display:none;" /> <!-- タイトル背景画像を非表示で指定 -->
<img id="back2i" src="back2.png" style="display:none;" /> <!-- ゲーム背景画像を非表示で指定 -->
<img id="playeri" src="player.gif" style="display:none;" /> <!-- 自機画像を非表示で指定 -->
<img id="tekii" src="enemy.gif" style="display:none;" /> <!-- 敵機画像を非表示で指定 -->
<img id="tamai" src="pbomb.gif" style="display:none;" /> <!-- 自弾画像を非表示で指定 -->
</body>
</html>
