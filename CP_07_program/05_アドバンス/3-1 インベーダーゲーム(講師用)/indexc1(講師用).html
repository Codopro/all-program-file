<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<!-- ここからJavaScriptプログラム -->
<script type="text/javascript" src="./parts.js"></script>
<script type="text/javascript" src="./partsc.js"></script>
<script type="text/javascript">
//固定データ（変わらないデータ）
let timer = 20 //主処理を呼ぶタイマーの実行間隔
//自機のX座標, Y座標, 幅, 高さ, 速度
let player = { x:300, y:395, sx:40, sy:40, mx:10 }
//敵機[0]のX座標, Y座標, 幅, 高さ, X速度, Y速度
let teki = { x:10, y:70, sx:60, sy:60, mx:1, my:10 }
//自弾の幅, 高さ, 速度
let tama = { sx:20, sy:20, mx:10 }
//【追加】敵弾の幅, 高さ, 速度, 発射待ち
let tekitama = { sx:20, sy:20, my:2, wait:100 }

//作業データ（ゲームの状態によって値が変わります）
let mode = 0 //ゲームの状態（0:タイトル画面,1:プレイ画面,9:ゲームオーバー画面）
let tamaf = 0 //自弾有無
let tekinum = 32 //敵機残数
let tekia = [] //敵機のリスト
let kougeki = 0 //自弾が発射されているか？
let hidari = 0 //左キーが押されている？
let migi = 0 //右キーが押されている？
let tekitamaf = 0 //【追加】敵弾有無
let tekitamaw = tekitama.wait //【追加】敵弾発射待ち

//キーをおし終えた時のしょり
function keyUp(evt) {
    if (mode === 0) { //タイトル画面？
        if (evt.keyCode === 13) { //Enterキー？
            tekijunbi() //敵機全機出現
            mode = 1 //プレイ画面へ
        }
    } else if (mode === 1) { //プレイ画面？
        if (evt.keyCode === 37) { //←キー？
            hidari = 0 //左キーが離された
        }
        if (evt.keyCode === 39) { //→キー？
            migi = 0 //右キーが離された
        }
        if (evt.keyCode === 32) { //Spaceキー？
            kougeki = 0 //スペースキーが離された
        }
    }
}

//キーがおされた時のしょり
function keyDown(evt) {
    if (mode === 1) { //プレイ画面？
        if (evt.keyCode === 37) { //←キー？
            hidari = 1 //左キーが押された
        }
        if (evt.keyCode === 39) { //→キー？
            migi = 1 //右キーが押された
        }
        if (evt.keyCode === 32) { //Spaceキー？
            kougeki = 1 //スペースキーが押された
        }
    }
}

//ゲーム中一定時間おきに実行されるしょり
function mainloop() {
    if (mode === 1) { //プレイ画面？
        if (hidari === 1) { //左キーが押されている？
            hidariidou() //自機を左へ
        }
        if (migi === 1) { //右キーが押されている？
            migiidou()//自機を右へ
        }
        if (kougeki === 1 && tamaf === 0) { //弾が出ていない、かつ、スペースキーが押された？
            tamauchi() //弾を発射
            tamaf = 1 //弾が出ていることにする
        }
        if (tamaf === 1) { //弾が出されている？
            tamaf = hit() //敵に当たったかどうかを調べる
        }
        if (tamaf === 1) { //弾が残っている？
            tamaf = tamaidou() //弾の移動する
        }
        if (tekinum > 0) { //敵機がまだある？
            tekiidou() //敵機の移動
            if (shinryaku() === 1) { //侵略された？
                mode = 9 //ゲームオーバー画面へ
            }
        }
        if (tekinum === 0) { //敵機全滅？
            tekijunbi() //敵機をもう一度出す
        }
        if (tekitamaf === 0) { //【以下追加】敵弾がない？
            if(tekitamaw-- < 0) { //発射待ちカウントダウン後、到達？
                tekikogeki() //敵弾発射
                tekitamaf = 1 //敵弾がある
            }
        }
        if (tekitamaf === 1) { //【以下追加】敵弾がある？
            tekitamaf = tekitamaplayerhit() //敵弾と自機の衝突判定
            tekitamaf = tekitamaido() //敵弾の移動
        }
    }
    draw() //画面を描く
}

//画面をえがくしょり
function draw() {
    if (mode === 0) { //タイトル画面？
        ctx.drawImage(back1i, 0, 0) //背景画像を表示
        ctx.font = '62pt Arial' //文字サイズを指定
        ctx.fillStyle = 'Orange' //文字をオレンジ色に
        ctx.fillText('Vertical Shooting', 10, 100) //文字列を表示
        ctx.font = '26pt Arial' //文字サイズを指定
        ctx.fillText('Hit Enter key to Start', 170, 450) //文字列を表示

        ctx.fillStyle = ctx.createPattern(tekii, 'repeat') //敵機画像でパターンを作る
        for (let i = 0; i < 5; i++) { //i=0,1,2,3,4についてくり返す
            if (i === 0) { //0番目ならば
                ctx.fillRect(240, 115, 180, 60)
            } else if (i <= 3) { //でなくて1～3番目ならば
                ctx.fillRect(300, 115 + i * 60, 60, 60)
            } else { //でなければ
                ctx.fillRect(240, 355, 180, 60)
            }
        }
    }
    if (mode === 1) { //プレイ画面？
        ctx.drawImage(back2i, 0, 0) //背景画像を表示
        if (tamaf === 1) { //弾が出ている？
            ctx.drawImage(tamai, tamax, tamay) //指定の位置に弾を表示
        }
        if (tekitamaf === 1) { //【以下追加】敵弾が有る？
            ctx.drawImage(tekitamai, tekitamax, tekitamay) //指定の位置に敵弾画像を表示
        }
    }
    if (mode === 9) { //ゲームオーバー画面？
        ctx.drawImage(back1i, 0, 0) //背景画像を表示
        ctx.font = '90pt Arial' //文字サイズを指定
        ctx.fillStyle = 'Red' //赤色に設定
        ctx.fillText('Game Over', 10, 150) //文字列を表示
        ctx.font = '26pt Arial' //文字サイズを指定
        ctx.fillText('Reload to Re-Start', 190, 450) //文字列を表示
    }
    if (mode != 0) { //タイトル画面以外？
        ctx.drawImage(playeri, playerx, playery) //指定の位置に自機画像を表示
        for (let i = 0; i < 32; i++) { //敵機全機について繰返す
            if (tekia[i].f === 1) { //敵機[i]が有る？
                ctx.drawImage(tekii, tekia[i].x, tekia[i].y) //敵機[i]の画像を表示
            }
        }
    }
}
</script>
<!-- ここまでJavaScriptプログラム -->
</head>
<body onload="init();"> <!-- 始まる時の処理 -->
<canvas id="canvas" width="640" height="480" /></canvas> <!-- キャンバスの設置 -->
<img id="back1i" src="back1.png" style="display:none;" /> <!-- タイトル背景画像を非表示で指定 -->
<img id="back2i" src="back2.png" style="display:none;" /> <!-- ゲーム背景画像を非表示で指定 -->
<img id="playeri" src="player.gif" style="display:none;" /> <!-- 自機画像を非表示で指定 -->
<img id="tekii" src="enemy.gif" style="display:none;" /> <!-- 敵機画像を非表示で指定 -->
<img id="tamai" src="pbomb.gif" style="display:none;" /> <!-- 自弾画像を非表示で指定 -->
<img id="tekitamai" src="ebomb.gif" style="display:none;" /> <!--【追加】敵弾画像を非表示で指定 -->
<img id="enjoi" src="burn.gif" style="display:none;" /> <!--【追加】自機炎上画像を非表示で指定 -->
<img id="enjo2i" src="burn2.gif" style="display:none;" /> <!--【追加】敵弾炎上画像を非表示で指定 -->
<img id="shogaii" src="hazard.gif" style="display:none;" /> <!--【追加】障害物画像を非表示で指定 -->
</body>
</html>
