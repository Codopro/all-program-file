<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<script type="text/javascript" src="parts.js"></script>
<script type="text/javascript">

function start() {
    timerno = setInterval(mainloop, timer)
}

function keyUp(evt) {
    if (mode === 0 && evt.keyCode === 13) {
        mode = 5
    }
}

function keyDown(evt) {
}

function mainloop() {

    draw()
}

function drawfield() {
    ctx.drawImage(haikei[1], 0, haikeiy)
    drawdrone(dronexy.x, dronexy.y)
}

function draw() {
    if (mode === 0) {
        ctx.drawImage(haikei[0], 0, 0)
        for (let j = 0; j < 4; j++) {
            for (let i = 0; i < 3; i++) {
                if (i < 2) {
                    drawbox(i, 556 * i + 42, 60 * j + 42, 1 - j * 0.2)
                } else {
                    drawbox(i, 42, -60 * j + 438, 1 - j * 0.2)
                }
            }
        }
        drawdrone(566, 406)
    } else if (mode === 5) {
        drawfield()
    }
}
</script>

</head>
<body onload="init();">
<canvas id="canvas" width="640" height="480" /></canvas>
<img class="box" src="box0.gif" style="display:none" />
<img class="box" src="box1.gif" style="display:none" />
<img class="box" src="box2.gif" style="display:none" />
<img class="haikei" src="haikei0.png" style="display:none" />
<img class="haikei" src="haikei1.png" style="display:none" />
<img id="drone" src="drone.gif" style="display:none" />
<img id="target0" src="target0.gif" style="display:none" />
<img class="msg" src="msg0.png" style="display:none" />
<img class="msg" src="msg1.png" style="display:none" />
</body>
</html>
