<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<script type="text/javascript" src="parts.js"></script>
<script type="text/javascript">

function start() {
    timerno = setInterval(mainloop, timer)
}

function keyUp(evt) {
    if (mode === 0 && evt.keyCode === 13) {
        target[0].e = 1
        target[0].x = Math.floor(Math.random() * (window1.sx - targeti.x * 2)) + targeti.x
        boxlist[onbox].e = 1
        dronemode = 1
        mode = 5
    } else if (mode === 5 && dronemode === 1 && evt.keyCode === 32) {
        boxlist[onbox].e = 2
        boxlist[onbox].x = dronexy.x
        boxlist[onbox].y = dronexy.y - drones.y / 2 + dropy
        dronemode = 0
    } else if (mode === 5 && dronemode === 0 && evt.keyCode === 13) {
        mode = getnextbox()
    }
}

function keyDown(evt) {
    if (mode === 5) {
        dronexy = movedrone(evt.keyCode, dronexy.x, dronexy.y)
    }
}

function mainloop() {
    if (mode === 5 || mode === 6) {
        haikeiy = haikeirenketsu(haikeiy)
        for (let i = 0; i < targetnum; i++) {
            if (target[i].e > 0) {
                targetmove(i)
            }
        }
        for (let i = 0; i < boxnum; i++) {
            movedropedbox(i)
            boxdroping(i)
            removebox(i)
        }
        nexttarget()
        targett = targetspeedup()
    }
    if (mode === 6) {
        mode = dropnextbox()
    }
    draw()
}

function drawfield() {
    ctx.drawImage(haikei[1], 0, haikeiy)
    ctx.drawImage(haikei[1], 0, haikeiy - window1.sy)
    for (let i = 0; i < targetnum; i++) {
        if (target[i].e > 0) {
            drawtarget(i)
        }
    }
    for (let i = 0; i < boxnum; i++) {
        if (boxlist[i].e >= 2 && boxlist[i].e <= 5) {
            drawbox(boxlist[i].n, boxlist[i].x, boxlist[i].y, 1 - 0.1 * boxlist[i].e)
        }
    }
    drawdrone(dronexy.x, dronexy.y)
    if (dronemode === 1) {
        drawbox(0, dronexy.x, dronexy.y + boxs.y / 2)
    } else if (mode === 6) {
        drawbox(0, dronexy.x, dronexy.y + boxs.y / 2, 21 - boxlist[onbox].e)
    }
    ctx.drawImage(msg[dronemode], 125, 8)
}

function draw() {
    if (mode === 0) {
        ctx.drawImage(haikei[0], 0, 0)
        for (let j = 0; j < 4; j++) {
            for (let i = 0; i < 3; i++) {
                if (i < 2) {
                    drawbox(i, 556 * i + 42, 60 * j + 42, 1 - j * 0.2)
                } else {
                    drawbox(i, 42, -60 * j + 438, 1 - j * 0.2)
                }
            }
        }
        drawdrone(566, 406)
    } else if (mode === 5 || mode === 6) {
        drawfield()
    }
}
</script>

</head>
<body onload="init();">
<canvas id="canvas" width="640" height="480" /></canvas>
<img class="box" src="box0.gif" style="display:none" />
<img class="box" src="box1.gif" style="display:none" />
<img class="box" src="box2.gif" style="display:none" />
<img class="haikei" src="haikei0.png" style="display:none" />
<img class="haikei" src="haikei1.png" style="display:none" />
<img id="drone" src="drone.gif" style="display:none" />
<img id="target0" src="target0.gif" style="display:none" />
<img class="msg" src="msg0.png" style="display:none" />
<img class="msg" src="msg1.png" style="display:none" />
</body>
</html>
