<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<script type="text/javascript" src="parts.js"></script>
<script type="text/javascript">
//9.スペースキーで箱をおろしEnterキーで補給するようにしよう

//ゲームの開始の時にやること
function start() {
    timerno = setInterval(mainloop, timer) //タイマーを起動する
}

//キーをおし終えた時にやること
function keyUp(evt) {
    if (mode === 0 && evt.keyCode === 13) { //タイトルモードでEnterキーがおされたら
        target[0].e = 1 //配達先[0]を表示する
        target[0].x = Math.floor(Math.random() * (window1.sx - targeti.x * 2)) + targeti.x //配達先[0]の位置を乱数で決める
        boxlist[onbox].e = 1 //箱[onbox]を出す
        dronemode = 1 //ドローンの状態を箱ありにする
        mode = 5 //プレイモードにする
    } else if (mode === 5 && dronemode === 1 && evt.keyCode === 32) { //【以下追加】プレイモードでドローンに箱ありでスペースキーがおされたら
        boxlist[onbox].e = 2 //箱をおろす状態にする
        boxlist[onbox].x = dronexy.x //箱中央のX座標をドローンに合わせる
        boxlist[onbox].y = dronexy.y - drones.y / 2 + dropy //箱中央のY座標をドローン前方の狙いの位置にする
        dronemode = 0 //ドローンの状態を箱なしにする
    } else if (mode === 5 && dronemode === 0 && evt.keyCode === 13) { //【以下追加】プレイモードでドローンに箱なしでEnterキーがおされたら
        mode = getnextbox() //次の箱があれば用意してゲームの状態を箱補給モードにする
    }
}

//キーがおされた時にやること
function keyDown(evt) {
    if (mode === 5) { //プレイモードならば
        dronexy = movedrone(evt.keyCode, dronexy.x, dronexy.y) //おされた矢印キーに応じてドローンの位置を上下左右に動かす
    }
}

//一定時間おきにやること
function mainloop() {
    if (mode === 5 || mode === 6) { //【変更】プレイモードか箱補給モードならば
        haikeiy = haikeirenketsu(haikeiy) //はいけい画像[1]のつなぎ目をスクロールの分だけ下げる
        for (let i = 0; i < targetnum; i++) { //配達先の数だけくり返す
            if (target[i].e > 0) { //配達先[i]があれば
                targetmove(i) //配達先[i]をスクロールに合わせて動かす
            }
        }
        for (let i = 0; i < boxnum; i++) { //【以下追加】箱の数だけくり返す
            movedropedbox(i) //箱[i]がおろしている状態ならばスクロールに合わせて下へ動かす
            boxdroping(i) //箱[i]がおろしている途中ならば状態を1つ進める
            removebox(i) //箱[i]がおろしている状態で見えなくなったら消す
        }
        nexttarget() //条件がそろったら次の配達先を出す
        targett = targetspeedup() //配達先が少しずつ早く現れるようにする
    }
    if (mode === 6) { //【以下追加】箱補給モードならば
        mode = dropnextbox() //次の箱をドローンへ補給し、完了したらプレイモードにする
    }
    draw() //画面をえがく
}

//プレイ画面でモードに共通するものをえがく
function drawfield() {
    ctx.drawImage(haikei[1], 0, haikeiy) //はいけい画像[1]を表示
    ctx.drawImage(haikei[1], 0, haikeiy - window1.sy) //はいけい画像[1]を上にもう１枚表示
    for (let i = 0; i < targetnum; i++) { //配達先の数だけくり返す
        if (target[i].e > 0) { //配達先[i]があれば
            drawtarget(i) //配達先[i]を表示
        }
    }
    for (let i = 0; i < boxnum; i++) { //【以下追加】箱の数だけくり返す
        if (boxlist[i].e >= 2 && boxlist[i].e <= 5) { //箱[i]をおろしているなら
            drawbox(boxlist[i].n, boxlist[i].x, boxlist[i].y, 1 - 0.1 * boxlist[i].e) //おろしている箱を表示
        }
    }
    drawdrone(dronexy.x, dronexy.y) //ドローンを表示
    if (dronemode === 1) { //ドローンに乗っている箱があれば
        drawbox(0, dronexy.x, dronexy.y + boxs.y / 2) //ドローンに乗っている箱を表示
    } else if (mode === 6) { //【以下追加】箱補給モードならば
        drawbox(0, dronexy.x, dronexy.y + boxs.y / 2, 21 - boxlist[onbox].e) //補給中の箱を表示
    }
    ctx.drawImage(msg[dronemode], 125, 8) //【追加】メッセージ画像を表示
}

//画面をえがく
function draw() {
    if (mode === 0) { //タイトルモードなら
        ctx.drawImage(haikei[0], 0, 0) //はいけい画像[0]を表示
        for (let j = 0; j < 4; j++) { //箱4個分くり返す
            for (let i = 0; i < 3; i++) { //箱3種類分くり返す
                if (i < 2) { //箱[0]、箱[1]ならば
                    drawbox(i, 556 * i + 42, 60 * j + 42, 1 - j * 0.2) //箱画像を位置と大きさを変えながら左上・右上に表示
                } else { //でなければ（箱[2]ならば）
                    drawbox(i, 42, -60 * j + 438, 1 - j * 0.2) //箱画像を位置と大きさを変えながら左下に表示
                }
            }
        }
        drawdrone(566, 406) //ドローンを右下に表示
    } else if (mode === 5 || mode === 6) { //【変更】プレイモードか箱補給モードならば
        drawfield() //プレイ画面でモードに共通するものをえがく
    }
}
</script>

</head>
