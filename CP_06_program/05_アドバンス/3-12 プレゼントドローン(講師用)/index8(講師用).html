<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<script type="text/javascript" src="parts.js"></script>
<script type="text/javascript">
//8.箱と配達先が現れるようにしよう

//ゲームの開始の時にやること
function start() {
    timerno = setInterval(mainloop, timer) //タイマーを起動する
}

//キーをおし終えた時にやること
function keyUp(evt) {
    if (mode === 0 && evt.keyCode === 13) { //タイトルモードでEnterキーがおされたら
        target[0].e = 1 //【追加】配達先[0]を表示する
        target[0].x = Math.floor(Math.random() * (window1.sx - targeti.x * 2)) + targeti.x //【追加】配達先[0]の位置を乱数で決める
        boxlist[onbox].e = 1 //【追加】箱[onbox]を出す
        dronemode = 1 //【追加】ドローンの状態を箱ありにする
        mode = 5 //プレイモードにする
    }
}

//キーがおされた時にやること
function keyDown(evt) {
    if (mode === 5) { //プレイモードならば
        dronexy = movedrone(evt.keyCode, dronexy.x, dronexy.y) //おされた矢印キーに応じてドローンの位置を上下左右に動かす
    }
}

//一定時間おきにやること
function mainloop() {
    if (mode === 5) { //プレイモードならば
        haikeiy = haikeirenketsu(haikeiy) //はいけい画像[1]のつなぎ目をスクロールの分だけ下げる
        for (let i = 0; i < targetnum; i++) { //【以下追加】配達先の数だけくり返す
            if (target[i].e > 0) { //配達先[i]があれば
                targetmove(i) //配達先[i]をスクロールに合わせて動かす
            }
        }
        nexttarget() //【追加】条件がそろったら次の配達先を出す
        targett = targetspeedup() //【追加】配達先が少しずつ早く現れるようにする
    }
    draw() //画面をえがく
}

//プレイ画面でモードに共通するものをえがく
function drawfield() {
    ctx.drawImage(haikei[1], 0, haikeiy) //はいけい画像[1]を表示
    ctx.drawImage(haikei[1], 0, haikeiy - window1.sy) //はいけい画像[1]を上にもう１枚表示
    for (let i = 0; i < targetnum; i++) { //【以下追加】配達先の数だけくり返す
        if (target[i].e > 0) { //配達先[i]があれば
            drawtarget(i) //配達先[i]を表示
        }
    }
    drawdrone(dronexy.x, dronexy.y) //ドローンを表示
    if (dronemode === 1) { //【以下追加】ドローンに乗っている箱があれば
        drawbox(0, dronexy.x, dronexy.y + boxs.y / 2) //ドローンに乗っている箱を表示
    }
}

//画面をえがく
function draw() {
    if (mode === 0) { //タイトルモードなら
        ctx.drawImage(haikei[0], 0, 0) //はいけい画像[0]を表示
        for (let j = 0; j < 4; j++) { //箱4個分くり返す
            for (let i = 0; i < 3; i++) { //箱3種類分くり返す
                if (i < 2) { //箱[0]、箱[1]ならば
                    drawbox(i, 556 * i + 42, 60 * j + 42, 1 - j * 0.2) //箱画像を位置と大きさを変えながら左上・右上に表示
                } else { //でなければ（箱[2]ならば）
                    drawbox(i, 42, -60 * j + 438, 1 - j * 0.2) //箱画像を位置と大きさを変えながら左下に表示
                }
            }
        }
        drawdrone(566, 406) //ドローンを右下に表示
    } else if (mode === 5) { //プレイモードならば
        drawfield() //プレイ画面でモードに共通するものをえがく
    }
}
</script>

</head>
<body onload="init();"> <!-- 最初に１回だけやること（起動処理）を示す -->
<canvas id="canvas" width="640" height="480" /></canvas> <!-- キャンバスの設置 -->

<img class="box" src="box1.gif" style="display:none" /> <!-- 箱画像[1]おき場 -->
<img class="box" src="box2.gif" style="display:none" /> <!-- 箱画像[2]おき場 -->
<img class="haikei" src="haikei0.png" style="display:none" /> <!-- はいけい画像[0]おき場 -->
<img class="haikei" src="haikei1.png" style="display:none" /> <!-- はいけい画像[1]おき場 -->
<img id="drone" src="drone.gif" style="display:none" /> <!-- ドローン画像おき場 -->
<img id="target0" src="target0.gif" style="display:none" /> <!-- 配達先画像おき場 -->
<img class="msg" src="msg0.png" style="display:none" /> <!-- メッセージ画像[0]おき場 -->
<img class="msg" src="msg1.png" style="display:none" /> <!-- メッセージ画像[1]おき場 -->
</body>
</html>
