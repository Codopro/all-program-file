<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<script type="text/javascript" src="map.js"></script>
<script type="text/javascript" src="parts.js"></script>
<script type="text/javascript">

function start() {
    for (let i = 0; i < 3; i++) {
        oto[i] = new Audio("oto" + i + ".mp3")
        oto[i].preload = "auto"
        oto[i].load()
    }
    timerno = setInterval(mainloop, timer)
}

function keyUp(evt) {
    if (mode === 0 && evt.keyCode === 13) {
        oto[0].currentTime = 0
        oto[0].play()
        setmap(0)
        setbonus()
        animecnt = 0
        mode = 3
    } else if (mode === 4 && evt.keyCode === 32) {
        mode = 5
    } else if (mode === 8 && evt.keyCode === 13) {
        ballback()
        mode = 4
    } else if (mode === 7 && evt.keyCode === 13) {
        ballback()
        stageno = stageno + 1
        if (stageno === wmap.length) {
            lapno = lapno + 1
            stageno = 0
            if (lapno < 6) {
                wmove = wmove * 2
            }
        }
        setmap(stageno)
        wmove = Math.abs(wmove)
        setbonus()
        mode = 4
    }
}

function setbonus() {
    while(true) {
        let i = Math.floor(Math.random() * cols)
        let j = Math.floor(Math.random() * lines)
        if (nmap[i][j] === 0) {
            nmap[i][j] = 3
            break
        }
    }
}

function keyDown(evt) {
    if (mode === 4 || mode === 5) {
        if (evt.keyCode === 37 && padxy.x > 0) {
            padxy.x = padxy.x - padspeed
            if (padxy.x < 0) {
                padxy.x = 0
            }
            if (mode === 4) {
                ballxy.x = padxy.x + 36
            }
        } else if (evt.keyCode === 39 && padxy.x + pads.x < window1.sx) {
            padxy.x = padxy.x + padspeed
            if (padxy.x  + pads.x > window1.sx) {
                padxy.x = window1.sx - pads.x
            }
            if (mode === 4) {
                ballxy.x = padxy.x + 36
            }
        }
    }
}

function mainloop() {
    if (mode === 5) {
        if (walltop.x + wmove < 1 || walltop.x + walls.x * cols + wmove > window1.sx) {
            wmove = -wmove
        }
        walltop.x = walltop.x + wmove
        if (ballv === 0) {
            ballxy.x = ballxy.x - ballspeed
            ballxy.y = ballxy.y - ballspeed
        } else if (ballv === 1) {
            ballxy.x = ballxy.x + ballspeed
            ballxy.y = ballxy.y - ballspeed
        } else if (ballv === 2) {
            ballxy.x = ballxy.x + ballspeed
            ballxy.y = ballxy.y + ballspeed
        } else if (ballv === 3) {
            ballxy.x = ballxy.x - ballspeed
            ballxy.y = ballxy.y + ballspeed
        }
        let touch = wallcheck(ballxy)
        if (touch === 9) {
            oto[2].currentTime = 0
            oto[2].play()
            animecnt = 0
            mode = 6
        } else if (touch === 0) {
            ballv = wallbound(ballv, ballxy)
        } else {
            if (ballxy.y > window1.sy) {
                if (restball > 0) {
                    restball = restball - 1
                    mode = 8
                } else {
                    oto[1].currentTime = 0
                    oto[1].play()
                    mode = 9
                }
            } else {
                ballv = padcheck(ballv, ballxy, padxy)
                ballv = edgecheck(ballv, ballxy)
            }
        }
    } else if (mode === 3) {
        animecnt = animecnt + 1
        if (animecnt > pads.y) {
            mode = 4
        }
    } else if (mode === 6) {
        animecnt = animecnt + 1
        if (animecnt >= window1.sy / 10) {
            mode = 7
        }
    }
    draw()
}

function drawfield() {
    drawwall()
    ctx.drawImage(ball[ballv], ballxy.x, ballxy.y)
    drawrestball(restball)
    drawstageno(stageno)
}

function draw() {
    ctx.drawImage(haikei, 0, 0)
    if (mode === 0) {
        for (let j = 0; j < 10; j++) {
            for (let i = 0; i < 10; i++) {
                if (j === 0) {
                    ctx.drawImage(wall[1], 200 + 24 * i, 72 + 24 * j)
                } else if (i !== 1 && i !== 8 || j !== 1 && j !== 8) {
                    ctx.drawImage(wall[0], 200 + 24 * i, 72 + 24 * j)
                }
            }
        }
        ctx.drawImage(title, 248, 120)
        drawstart()
    } else if (mode === 3)  {
        ctx.drawImage(pad, padxy.x, padxy.y, pads.x, animecnt)
    } else if (mode === 4 || mode === 5)  {
        ctx.drawImage(pad, padxy.x, padxy.y)
        drawfield()
    } else if (mode === 6)  {
        ctx.drawImage(himeclear, 192, animecnt * 10 - window1.sy)
    } else if (mode === 7)  {
        ctx.drawImage(himeclear, 192, 0)
        drawnextstage()
    } else if (mode === 8)  {
        drawfield()
        drawnext()
    } else if (mode === 9)  {
        ctx.drawImage(himelost, 192, 0)
    }
}
</script>

</head>
<body onload="init();">
<canvas id="canvas" width="640" height="480" /></canvas>
<img id="title" src="title.png" style="display:none" />
<img id="haikei" src="haikei.png" style="display:none" />
<img class="wall" src="wall0.gif" style="display:none" />
<img class="wall" src="wall1.gif" style="display:none" />
<img class="wall" src="wall2.gif" style="display:none" />
<img class="wall" src="wall3.gif" style="display:none" />
<img id="himemini" src="himemini.png" style="display:none" />
<img id="pad" src="pad.gif" style="display:none" />
<img class="ball" src="ball0.gif" style="display:none" />
<img class="ball" src="ball1.gif" style="display:none" />
<img class="ball" src="ball2.gif" style="display:none" />
<img class="ball" src="ball3.gif" style="display:none" />
<img id="himelost" src="himelost.png" style="display:none" />
<img id="himeclear" src="himeclear.png" style="display:none" />
</body>
</html>
