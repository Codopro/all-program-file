<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<script type="text/javascript" src="parts.js"></script>
<script type="text/javascript">
//5.タイトル画面を仕上げてプレイ画面を表示しよう

//ゲームの開始の時にやること
function start() {
    timerno = setInterval(mainloop, timer) //タイマーを起動する
}

//クリックされた時にやること
function onclick_canvas(evt) {
    mouse = mousezahyo(canvas, evt) //マウスカーソルの座標を得る
    if (mode === 0 && mouse.x >= 224 && mouse.x <= 416 && mouse.y >= 144 && mouse.y <= 336) { //【以下追加】タイトルモードでタイトルがクリックされたら
        mode = 5 //プレイモードにする
    }
}

//マウスが動いた時にやること
function onmove_canvas(evt) {

}

//一定時間おきにやること
function mainloop() {

    draw() //画面をえがく処理を呼ぶ
}

//はいけい、キャンディなどをえがく
function drawitem() {
    ctx.drawImage(haikei1, 0, 0) //【追加】プレイはいけい画像を表示
}

//画面をえがく
function draw() {
    if (mode === 0) { //【追加】タイトルモードなら
        ctx.drawImage(haikei, 0, 0) //タイトルはいけい画像を表示
        for (let i = 0; i < 5; i++) { //横に5回くり返す
            for (let j = 0; j < 5; j++) { //縦に5回くり返す
                if (i === 0 || i === 4 || j === 0 || j === 4) { //周囲であれば
                    let k = i + j //画像が1つずつずれるようにする
                    if (k >= 5) { //一回りしたら
                        k = k - 5 //先頭にもどす
                    }
                    ctx.drawImage(candyb[k], 160 + 64 * i, 80 + 64 * j) //キャンディ大画像を表示
                }
            }
        }
        ctx.drawImage(title, 224, 144) //【追加】タイトル画像を表示
    } else if (mode === 5) { //【以下追加】プレイモードならば
        drawitem() //はいけい、キャンディなどをえがく
    } //【追加】
}
</script>

</head>
<body onload="init();"> <!-- 最初に１回だけやること（起動処理）を示す -->
<canvas id="canvas" width="640" height="480" /></canvas> <!-- キャンバスの設置 -->
<img class="candyb" src="candyb0.gif" style="display:none" /> <!-- キャンディ大画像[0]おき場 -->
<img class="candyb" src="candyb1.gif" style="display:none" /> <!-- キャンディ大画像[1]おき場 -->
<img class="candyb" src="candyb2.gif" style="display:none" /> <!-- キャンディ大画像[2]おき場 -->
<img class="candyb" src="candyb3.gif" style="display:none" /> <!-- キャンディ大画像[3]おき場 -->
<img class="candyb" src="candyb4.gif" style="display:none" /> <!-- キャンディ大画像[4]おき場 -->
<img id="haikei" src="haikei.png" style="display:none" /> <!-- タイトルはいけい画像おき場 -->
<img id="haikei1" src="haikei1.png" style="display:none" /> <!-- プレイはいけい画像おき場 -->
<img id="title" src="title.png" style="display:none" /> <!-- タイトル画像おき場 -->
<img class="candy" src="candy0.gif" style="display:none" /> <!-- キャンディ画像[0]おき場 -->
<img class="candy" src="candy1.gif" style="display:none" /> <!-- キャンディ画像[1]おき場 -->
<img class="candy" src="candy2.gif" style="display:none" /> <!-- キャンディ画像[2]おき場 -->
<img id="catcher" src="catcher.gif" style="display:none" /> <!-- キャッチャー画像おき場 -->
<img id="star" src="star.gif" style="display:none" /> <!-- 星画像おき場 -->
<img id="net" src="net.gif" style="display:none" /> <!-- ネット画像おき場 -->
</body>
</html>
